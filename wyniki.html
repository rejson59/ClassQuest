<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyniki i raporty — ClassQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .ses-row { cursor: pointer; }
    .ses-row.on { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); }
    .hardest { border-left: 4px solid var(--red); }
    .easiest { border-left: 4px solid var(--green); }
    .bar-row { grid-template-columns: 1fr 2fr 64px; }
    .print-head { display: none; }
    @media print {
      .no-print { display: none !important; }
      .print-head { display: block; margin-bottom: 14px; }
      body { background: #fff; }
      .neu-card { box-shadow: none; border: 1px solid #e2e8f0; }
      .split-sidebar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="page-head row-between wrap">
    <div><h1>Wyniki i raporty</h1><p>Po lekcji widać nie tylko kto wygrał, ale które pytanie zostało z gruntu źle zrozumiane.</p></div>
    <div class="row-8 wrap no-print">
      <span id="mode-slot"></span>
      <button class="neu-btn sm" data-print>🖨️ Drukuj raport</button>
      <button class="neu-btn sm primary" id="csv">⬇️ CSV</button>
    </div>
  </div>

  <div class="grid-4 mb-24" id="summary"></div>

  <div class="split-sidebar">
    <div class="stack stack-12 no-print">
      <div class="neu-card pad-sm">
        <label class="neu-label" for="f-klasa">Filtruj po klasie</label>
        <div class="select-wrap"><select class="neu-select" id="f-klasa"></select></div>
        <input class="neu-input mt-8" id="f-q" placeholder="Szukaj po nazwie zestawu…" autocomplete="off">
      </div>
      <div class="stack stack-10" id="sesje-list"></div>
    </div>
    <div id="detail" class="stack stack-24"></div>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script type="module">
  const { ui } = CQ;
  const $ = (s) => document.querySelector(s);
  const me = await ui.bootTeacher({ active: 'wyniki' });
  if (!me) throw new Error('brak dostępu');
  await CQ.store.ready();
  $('#mode-slot').innerHTML = ui.modeChip();

  let sesjaId = new URLSearchParams(location.search).get('sesja') || localStorage.getItem('cq_raport_sesja') || null;
  let uczenFilter = new URLSearchParams(location.search).get('uczen') || null;
  let klasaFilter = localStorage.getItem('cq_raport_klasa') || '';
  let q = '';

  function sesje() {
    let out = CQ.Gra.historia(me.id);
    if (klasaFilter) out = out.filter((s) => s.klasa_id === klasaFilter);
    if (q) out = out.filter((s) => CQ.normalize((CQ.store.byId('zestawy', s.zestaw_id) || {}).nazwa_zestawu || '').includes(CQ.normalize(q)));
    return out;
  }

  function renderFilters() {
    const klasy = CQ.Klasy.list(me.id);
    const sel = $('#f-klasa');
    sel.innerHTML = '<option value="">wszystkie klasy</option>' + klasy.map((k) => `<option value="${k.id}" ${k.id === klasaFilter ? 'selected' : ''}>${ui.esc(k.nazwa)}</option>`).join('');
    sel.value = klasaFilter;
  }

  function renderList() {
    const lista = sesje();
    if (uczenFilter) {
      const u = CQ.store.byId('uczniowie', uczenFilter);
      const sesjeUcznia = lista.filter((s) => CQ.Gra.gracze(s.id).some((g) => g.uczen_id === u.id));
      $('#sesje-list').innerHTML = `<div class="neu-card pad-sm"><b>🎯 Profil ucznia</b>
        <div class="tiny muted mt-8">Wyniki ${ui.esc(u ? u.nazwa : '?')} w ${sesjeUcznia.length} grach.
        <a href="wyniki.html" class="semi">pokaż wszystkie raporty →</a></div></div>`
        + (sesjeUcznia.length ? sesjeUcznia.map((s) => card(s, u)).join('') : ui.empty('📄', 'Brak gier tej uczennicy/ucznia'));
      return;
    }
    $('#sesje-list').innerHTML = lista.length ? lista.map((s) => card(s)).join('')
      : ui.empty('📭', 'Brak rozegranych gier', 'Zagraj lekcję, a raport pojawi się tutaj automatycznie.',
        '<a class="neu-btn sm primary" href="nauczyciel.html">Panel nauczyciela</a>');
  }

  function card(s, uczen) {
    const z = CQ.store.byId('zestawy', s.zestaw_id);
    const k = CQ.store.byId('klasy', s.klasa_id);
    const w = CQ.Gra.wynik(s.id);
    const me0 = uczen ? w.rows.find((r) => r.uczen_id === uczen.id) : null;
    const srednia = w.rows.length ? Math.round(w.rows.reduce((a, b) => a + (b.dobre / Math.max(1, b.dobre + b.zle)), 0) / w.rows.length * 100) : 0;
    return `<div class="neu-card pad-sm ses-row ${s.id === sesjaId ? 'on' : ''}" data-sesja="${s.id}">
      <div class="row-between"><b>${ui.esc(z ? z.nazwa_zestawu : 'zestaw usunięty')}</b><span class="badge">${CQ.TRYBY[s.tryb]?.nazwa || s.tryb}</span></div>
      <div class="tiny muted mt-8">${ui.fmtDate(s.zakonczo || s.utworzono)} · ${ui.esc(k ? k.nazwa : '—')} · ${w.rows.length} graczy · średnio ${srednia}% dobrze</div>
      <div class="row-8 mt-8">${me0
        ? `<span class="badge blue">miejsce ${me0.miejsce} · ${ui.fmtPts(me0.punkty)} pkt</span>`
        : `<span class="badge green">${w.rows[0] ? '🥇 ' + ui.esc(w.rows[0].nazwa) : '—'}</span>`}</div>
    </div>`;
  }

  function renderDetail() {
    const box = $('#detail');
    if (!sesje().some((s) => s.id === sesjaId)) sesjaId = sesje()[0]?.id || null;
    if (!sesjaId) { box.innerHTML = ui.empty('📊', 'Wybierz raport', 'Lewoklik na liście gier po lewej.'); return; }
    localStorage.setItem('cq_raport_sesja', sesjaId);
    const rep = CQ.Raporty.podsumowanieSesji(sesjaId);
    if (!rep) { box.innerHTML = ui.empty('❓', 'Nie znaleziono raportu'); return; }
    const { sesja, zestaw, klasa, wyniki, perQuestion, druzyny, najtrudniejsze } = rep;
    const graczeLiczba = wyniki.length || 1;
    const sumaOdp = perQuestion.reduce((a, b) => a + b.odp, 0);
    const sumaDobrych = perQuestion.reduce((a, b) => a + b.poprawnych, 0);
    const dokladnosc = sumaOdp ? Math.round(sumaDobrych / sumaOdp * 100) : 0;

    box.innerHTML = `
      <div class="print-head"><h2>ClassQuest — raport: ${ui.esc(zestaw?.nazwa_zestawu || '')}</h2>
        <p>${ui.fmtDate(sesja.zakonczo || sesja.utworzono)} · klasa ${ui.esc(klasa?.nazwa || '')} · ${wyniki.length} graczy</p></div>

      <div class="neu-card">
        <div class="row-between wrap">
          <div><div class="section-title" style="margin-bottom:2px">🏁 ${ui.esc(zestaw?.nazwa_zestawu || 'Zestaw usunięty')}</div>
            <div class="tiny muted">${ui.fmtDate(sesja.zakonczo || sesja.utworzono)} · kod pokoju ${ui.esc(sesja.kod)} · tryb ${CQ.TRYBY[sesja.tryb]?.nazwa || sesja.tryb}</div></div>
          <div class="row-8 wrap no-print">
            <a class="neu-btn sm" href="klasy.html?klasa=${sesja.klasa_id}">Klasa</a>
            <button class="neu-btn sm primary" data-again>↻ Zagraj ponownie</button>
            <button class="neu-btn sm danger" data-del>🗑️</button>
          </div>
        </div>

        <div class="grid-4 mt-16" style="gap:10px">
          <div class="stat"><div class="label">Gracze</div><div class="value">${wyniki.length}</div></div>
          <div class="stat"><div class="label">Pytania</div><div class="value">${perQuestion.length}</div></div>
          <div class="stat"><div class="label">Dokładność</div><div class="value" style="color:${dokladnosc > 70 ? 'var(--green)' : dokladnosc > 45 ? 'var(--amber)' : 'var(--red)'}">${dokladnosc}%</div></div>
          <div class="stat"><div class="label">Śr. czas</div><div class="value">${(perQuestion.reduce((a, b) => a + b.sredniCzas, 0) / Math.max(1, perQuestion.length) / 1000).toFixed(1)}s</div></div>
        </div>
      </div>

      ${wyniki.length ? `<div class="neu-card">
        <div class="section-title">🏆 Klasyfikacja</div>
        <div class="podium mb-16">
          ${wyniki.slice(0, 3).map((r, i) => `<div class="place p${i + 1}">
            <div class="medal">${['🥇', '🥈', '🥉'][i]}</div>${ui.avatar(r.nazwa, r.kolor, r.nakrycie)}
            <div class="name">${ui.esc(r.nazwa)}</div><div class="pts">${ui.fmtPts(r.punkty)} pkt</div>
            <div class="tiny muted">${r.dobre}/${r.dobre + r.zle} dobrze</div></div>`).join('')}
        </div>
        ${druzyny ? `<div class="grid-4" style="gap:10px">${druzyny.map((t) => `<div class="neu-card pad-sm center">
          <div>${t.emoji}</div><b>${t.nazwa}</b><div class="value bold" style="color:${t.kolor};font-size:1.3rem">${ui.fmtPts(t.punkty)}</div>
          <div class="progress mt-8"><i style="width:${Math.round(t.punkty / Math.max(1, druzyny[0].punkty) * 100)}%;background:${t.kolor}"></i></div></div>`).join('')}</div>` : ''}
        <div class="table-wrap mt-16"><table class="data">
          <thead><tr><th>#</th><th>Uczeń</th><th>Punkty</th><th>Dobrze</th><th>Błędy</th><th>Śr. czas</th><th>XP</th></tr></thead>
          <tbody>${wyniki.map((r) => {
            const u = r.uczen_id ? CQ.store.byId('uczniowie', r.uczen_id) : null;
            const xp = CQ.store.where('wpisy_xp', (w) => w.sesja_id === sesja.id && w.uczen_id === r.uczen_id).reduce((a, b) => a + b.kwota, 0);
            return `<tr><td class="num">${r.miejsce}</td>
              <td><b>${ui.esc(r.nazwa)}</b>${u ? `<div class="tiny muted">nr ${u.numer} · ${CQ.poziomZxp(u.xp).nazwa}</div>` : '<div class="tiny muted">poza dziennikiem</div>'}</td>
              <td class="num"><b>${ui.fmtPts(r.punkty)}</b></td>
              <td class="num" style="color:var(--green)">${r.dobre}</td>
              <td class="num" style="color:var(--red)">${r.zle}</td>
              <td class="num">${r.sredniCzas ? (r.sredniCzas / 1000).toFixed(1) + 's' : '—'}</td>
              <td class="num">${xp ? '+' + xp : '—'}</td></tr>`;
          }).join('')}</tbody></table></div>
      </div>` : ''}

      <div class="neu-card">
        <div class="section-title">📉 Pytanie po pytaniu <span class="spacer"></span>
          <span class="tiny muted">odsetek uczniów, którzy odpowiedzieli poprawnie</span></div>
        <div class="bar-chart">
          ${perQuestion.map((p, i) => {
            const pct = p.odp ? Math.round(p.poprawnych / p.odp * 100) : 0;
            const cls = pct >= 70 ? 'good' : pct < 40 ? 'bad' : '';
            return `<div class="bar-row" title="${ui.esc(p.pytanie.tresc)}">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i + 1}. ${ui.esc(p.pytanie.tresc.slice(0, 34))}</span>
              <span class="bar"><i class="${cls}" style="width:${pct}%"></i></span>
              <span class="val">${pct}%</span></div>`;
          }).join('')}
        </div>
        ${najtrudniejsze.length ? `<div class="mt-16 stack stack-8">
          ${najtrudniejsze.map((p) => `<div class="list-item hardest" style="padding:12px 16px">
            <span class="lead red">${Math.round(p.odp ? p.poprawnych / p.odp * 100 : 0)}%</span>
            <div class="body"><strong>${ui.esc(p.pytanie.tresc)}</strong>
              <small>${p.odp} odpowiedzi · poprawna: ${ui.esc(p.pytanie.typ === 'otwarte' ? p.pytanie.poprawna_odp.split(';')[0] : (p.pytanie[{'A':'opcja_a','B':'opcja_b','C':'opcja_c','D':'opcja_d'}[p.pytanie.poprawna_opcja]] || p.pytanie.poprawna_opcja))}</small></div>
            <button class="neu-btn sm no-print" data-fix="${p.pytanie.id}">Popraw pytanie</button></div>`).join('')}
        </div>` : ''}
      </div>

      ${perQuestion.some(p => p.rozklad && Object.keys(p.rozklad).length) ? `<div class="neu-card">
        <div class="section-title">🧩 Rozkład odpowiedzi</div>
        <div class="grid-2" style="gap:14px">
          ${perQuestion.map((p, i) => `<div class="neu-card pad-sm flat">
            <b class="small">${i + 1}. ${ui.esc(p.pytanie.tresc.slice(0, 60))}</b>
            <div class="bar-chart mt-8">${Object.entries(p.rozklad).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
              <div class="bar-row" style="grid-template-columns:54px 1fr 40px;font-size:.78rem">
                <span class="bold">${ui.esc(k === 'OK' ? 'dobrze' : k === 'błąd' ? 'błąd' : k + '.' + (p.pytanie[{'A':'opcja_a','B':'opcja_b','C':'opcja_c','D':'opcja_d'}[k]] ? ' ' + p.pytanie[{'A':'opcja_a','B':'opcja_b','C':'opcja_c','D':'opcja_d'}[k]].slice(0, 14) : ''))}</span>
                <span class="bar"><i class="${k === p.pytanie.poprawna_opcja ? 'good' : ''}" style="width:${Math.round(v / Math.max(1, p.odp) * 100)}%"></i></span>
                <span class="val">${v}</span></div>`).join('')}</div>
          </div>`).join('')}
        </div>
      </div>` : ''}
    `;

    box.querySelector('[data-del]')?.addEventListener('click', async () => {
      const yes = await ui.confirmBox('Usunąć raport?', 'Usunięta zostanie sesja wraz z odpowiedziami graczy. XP już przyznane uczniom pozostanie w ich księdze.', { ok: 'Usuń', danger: true });
      if (!yes) return;
      await CQ.Gra.usun(sesja.id);
      sesjaId = null;
      ui.toast('Raport usunięty.', 'warn');
      render();
    });
    box.querySelector('[data-again]')?.addEventListener('click', async () => {
      try {
        const nowa = await CQ.Gra.createSession({ nauczycielId: me.id, klasaId: sesja.klasa_id, zestawId: sesja.zestaw_id, tryb: sesja.tryb, limitS: sesja.limit_s });
        localStorage.setItem('cq_aktywna_sesja', nowa.id);
        ui.toast(`Nowa gra w lobby — kod ${nowa.kod}`, 'ok');
        setTimeout(() => location.href = 'nauczyciel.html', 900);
      } catch (e) { ui.toast(e.message, 'err'); }
    });
    box.querySelector('[data-fix]')?.addEventListener('click', (e) => {
      location.href = 'zestawy.html?zestaw=' + sesja.zestaw_id;
    });
  }

  $('#csv').addEventListener('click', () => {
    if (!sesjaId) return ui.toast('Wybierz raport.', 'warn');
    ui.download(`wyniki-${sesjaId.slice(0, 8)}.csv`, CQ.Raporty.doCsv(sesjaId), 'text/csv');
    ui.toast('Pobrano CSV.', 'ok');
  });
  document.querySelector('[data-print]').addEventListener('click', () => window.print());
  $('#f-klasa').addEventListener('change', (e) => { klasaFilter = e.target.value; localStorage.setItem('cq_raport_klasa', klasaFilter); render(); });
  $('#f-q').addEventListener('input', (e) => { q = e.target.value; renderList(); });
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-sesja]');
    if (c) { sesjaId = c.dataset.sesja; render(); }
  });

  function render() { renderFilters(); renderList(); renderDetail(); }
  ui.live(render);
  render();
</script>
</body>
</html>
