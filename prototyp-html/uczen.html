<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Dołącz do gry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e6ecf5;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent: #2563eb;
      --accent-green: #10b981;

      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
    }

    /* Karta bazowa */
    .neu-card {
      background: linear-gradient(145deg, #f0f6ff, #e0e7f1);
      border-radius: 32px;
      padding: 36px 32px;
      box-shadow: 
        14px 14px 28px var(--shadow-dark),
        -14px -14px 28px var(--shadow-light);

      opacity: 0;
      transform: translate(-15px, -15px) scale(0.96);
      animation: cardAppear 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    /* Step System */
    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    /* Wklęsłe Inputy */
    .neu-input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 18px;
      border: none;
      outline: none;
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 20px;

      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .neu-input::placeholder {
      letter-spacing: normal;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Lista uczniów w dzienniku */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 20px;
    }

    .student-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 
        4px 4px 8px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
      transition: all 0.2s ease;
    }

    .student-item:hover, .student-item.selected {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .student-num {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(37, 99, 235, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .student-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Podgląd Ludzika */
    .avatar-preview-box {
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .character {
      width: 60px;
      height: 80px;
      position: relative;
      transition: all 0.2s ease;
    }

    /* Ludzik w stylu bean/bean-avatar */
    .char-body {
      width: 100%;
      height: 100%;
      background: var(--char-color, #2563eb);
      border-radius: 30px 30px 20px 20px;
      position: relative;
      box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2), inset 4px 4px 8px rgba(255,255,255,0.4);
    }

    .char-eyes {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .eye {
      width: 8px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      position: relative;
    }

    .eye::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #000000;
      border-radius: 50%;
      top: 4px;
      left: 2px;
    }

    .char-hat {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
    }

    /* Wybór koloru */
    .color-picker {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      transition: transform 0.15s ease;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    /* Wybór nakrycia głowy */
    .hat-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .hat-btn {
      padding: 8px 12px;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    }

    /* Przycisk Akcji */
    .neu-btn {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      color: var(--accent);
      font-weight: 800;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 
        6px 6px 12px var(--shadow-dark),
        -6px -6px 12px var(--shadow-light);
      transition: all 0.15s ease;
    }

    .neu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    }

    .neu-btn:active {
      transform: translateY(1px);
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      animation: letterJump 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes letterJump {
      0% { opacity: 0; transform: translateY(14px); }
      60% { transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="neu-card">
      <a href="index.html" class="back-link">← Wróć</a>
      
      <h1 class="title" id="titleText">Dołącz do gry</h1>
      <p class="subtitle" id="subtitleText">Wpisz kod PIN przekazany przez nauczyciela</p>

      <div class="step active" id="step1">
        <input type="text" class="neu-input" id="pinInput" placeholder="KOD PIN (np. 482 910)" maxlength="7" />
        <button class="neu-btn" onclick="goToStep(2)">Dalej →</button>
      </div>

      <div class="step" id="step2">
        <p style="font-weight: 700; font-size: 0.85rem; color: var(--text-main); margin-bottom: 12px;">Wybierz swój numer z dziennika:</p>
        <div class="student-list" id="studentList">
          <div class="student-item" onclick="selectStudent(this, 'Jan Kowalski')">
            <span class="student-num">1</span>
            <span class="student-name">Jan Kowalski</span>
          </div>
          <div class="student-item" onclick="selectStudent(this, 'Anna Nowak')">
            <span class="student-num">2</span>
            <span class="student-name">Anna Nowak</span>
          </div>
          <div class="student-item" onclick="selectStudent(this, 'Piotr Wiśniewski')">
            <span class="student-num">3</span>
            <span class="student-name">Piotr Wiśniewski</span>
          </div>
          <div class="student-item" onclick="selectStudent(this, 'Kasia Zielińska')">
            <span class="student-num">4</span>
            <span class="student-name">Kasia Zielińska</span>
          </div>
        </div>
        <button class="neu-btn" id="confirmStudentBtn" onclick="goToStep(3)" style="opacity: 0.5; pointer-events: none;">Zatwierdź wybór</button>
      </div>

      <div class="step" id="step3">
        <div class="avatar-preview-box">
          <div class="character" id="charPreview">
            <div class="char-hat" id="charHat">👑</div>
            <div class="char-body" id="charBody">
              <div class="char-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
              </div>
            </div>
          </div>
          <p id="selectedNameLabel" style="font-weight: 800; font-size: 0.95rem; margin-top: 12px; color: var(--text-main);">Jan Kowalski</p>
        </div>

        <div class="color-picker">
          <div class="color-dot" style="background: #2563eb;" onclick="changeColor('#2563eb')"></div>
          <div class="color-dot" style="background: #10b981;" onclick="changeColor('#10b981')"></div>
          <div class="color-dot" style="background: #f59e0b;" onclick="changeColor('#f59e0b')"></div>
          <div class="color-dot" style="background: #ec4899;" onclick="changeColor('#ec4899')"></div>
          <div class="color-dot" style="background: #8b5cf6;" onclick="changeColor('#8b5cf6')"></div>
        </div>

        <div class="hat-picker">
          <button class="hat-btn" onclick="changeHat('👑')">👑</button>
          <button class="hat-btn" onclick="changeHat('🎓')">🎓</button>
          <button class="hat-btn" onclick="changeHat('🎧')">🎧</button>
          <button class="hat-btn" onclick="changeHat('🚀')">🚀</button>
          <button class="hat-btn" onclick="changeHat('')">❌</button>
        </div>

        <button class="neu-btn" onclick="joinLobby()">Wejdź do gry 🎮</button>
      </div>

    </div>
  </div>

  <script>
    let selectedStudent = "";

    function animateText(elementId, baseDelay) {
      const el = document.getElementById(elementId);
      const text = el.innerText;
      el.innerHTML = '';
      
      [...text].forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerHTML = char === ' ' ? '&nbsp;' : char;
        span.style.animationDelay = `${baseDelay + (index * 0.03)}s`;
        el.appendChild(span);
      });
    }

    animateText('titleText', 0.15);
    animateText('subtitleText', 0.3);

    function goToStep(stepNum) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');

      const subtitle = document.getElementById('subtitleText');
      if (stepNum === 2) subtitle.innerText = "Wskaż kim jesteś z listy klasy 8B";
      if (stepNum === 3) subtitle.innerText = "Dostosuj swój wygląd przed wejściem na planszę";
    }

    function selectStudent(element, name) {
      document.querySelectorAll('.student-item').forEach(item => item.classList.remove('selected'));
      element.classList.add('selected');
      selectedStudent = name;
      
      const btn = document.getElementById('confirmStudentBtn');
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      document.getElementById('selectedNameLabel').innerText = name;
    }

    function changeColor(color) {
      document.getElementById('charBody').style.background = color;
    }

    function changeHat(hat) {
      document.getElementById('charHat').innerText = hat;
    }

    function joinLobby() {
      alert(`Wchodzisz do gry jako ${selectedStudent}! Przekierowanie do lobby 2D...`);
    }
  </script>

</body>
</html>
