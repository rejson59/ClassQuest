<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - przykładowy wygląd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Zmienne dla motywu jasnego (Light Mode) */
    :root {
      --bg: #e6ecf5;
      --text-main: #4a5568;
      --text-muted: #8c9ba5;
      --blue-main: #2563eb;
      --blue-glow: rgba(37, 99, 235, 0.45);
      --blue-gradient: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      --blue-light-gradient: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      
      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
      --card-bg: #e6ecf5;
    }

    /* Zmienne dla motywu ciemnego (Dark Mode) */
    [data-theme="dark"] {
      --bg: #1e232a;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --blue-main: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.5);
      
      --shadow-dark: rgba(15, 18, 22, 0.8);
      --shadow-light: rgba(45, 53, 64, 0.5);
      --card-bg: #1e232a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.3s ease;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Karta Główna z dynamicznym cieniem */
    .neu-card {
      background: var(--card-bg);
      border-radius: 36px;
      padding: 48px 42px;
      width: 100%;
      max-width: 840px;
      
      box-shadow: 
        25px 25px 50px var(--shadow-dark),
        -25px -25px 50px var(--shadow-light);

      opacity: 0;
      transform: translate(-30px, -30px) scale(0.96);
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    /* Nagłówek i przełącznik motywu */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: letterJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes letterJump {
      60% { transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Grid Layout dla Elementów UI */
    .ui-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 36px;
    }

    .ui-column {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Przycisk Neumorficzny z fizyką Soft-Press */
    .neu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      outline: none;
      
      box-shadow: 
        8px 8px 16px var(--shadow-dark),
        -8px -8px 16px var(--shadow-light);

      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, color 0.2s ease;
      user-select: none;
    }

    .neu-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light);
      color: var(--blue-main);
    }

    .neu-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .neu-btn-square {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 16px;
    }

    /* DROPDOWN COMPONENT */
    .neu-dropdown-wrapper {
      position: relative;
      flex: 1;
    }

    .neu-dropdown-btn {
      width: 100%;
      justify-content: space-between;
    }

    .dropdown-arrow {
      font-size: 0.75rem;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .neu-dropdown-wrapper.active .dropdown-arrow {
      transform: rotate(180deg);
    }

    .neu-dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 10px;
      z-index: 100;
      
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px) scale(0.95);
      transform-origin: top center;
      transition: opacity 0.3s ease 0.15s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s, visibility 0.35s step-end 0.35s;
      pointer-events: none;
    }

    .neu-dropdown-wrapper.active .neu-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0s;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 14px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.25s ease, background-color 0.2s ease, color 0.2s ease;
    }

    /* Kaskadowe ukrywanie opcji przy zamykaniu (od dołu do góry) */
    .dropdown-item:nth-child(1) { transition-delay: 0.15s, 0.15s, 0s, 0s; }
    .dropdown-item:nth-child(2) { transition-delay: 0.1s, 0.1s, 0s, 0s; }
    .dropdown-item:nth-child(3) { transition-delay: 0.05s, 0.05s, 0s, 0s; }
    .dropdown-item:nth-child(4) { transition-delay: 0s, 0s, 0s, 0s; }

    /* Kaskadowe pojawianie się opcji po otwarciu (od góry do dołu) */
    .neu-dropdown-wrapper.active .dropdown-item {
      opacity: 1;
      transform: translateY(0);
    }

    .neu-dropdown-wrapper.active .dropdown-item:nth-child(1) { transition-delay: 0.05s; }
    .neu-dropdown-wrapper.active .dropdown-item:nth-child(2) { transition-delay: 0.1s; }
    .neu-dropdown-wrapper.active .dropdown-item:nth-child(3) { transition-delay: 0.15s; }
    .neu-dropdown-wrapper.active .dropdown-item:nth-child(4) { transition-delay: 0.2s; }

    .dropdown-item:hover {
      background: rgba(37, 99, 235, 0.08);
      color: var(--blue-main);
      transform: translateY(0) scale(1.03) translateX(4px) !important;
    }

    .dropdown-item:active {
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light);
    }

    /* Input z aktywnym stanem Glow Focus */
    .neu-input-wrapper {
      position: relative;
      width: 100%;
    }

    .neu-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      border-radius: 20px;
      border: 1px solid transparent;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light);

      transition: all 0.3s ease;
    }

    .neu-input::placeholder {
      color: var(--text-muted);
    }

    .neu-input:focus {
      border-color: var(--blue-main);
      box-shadow: 
        inset 6px 6px 12px var(--shadow-dark),
        inset -6px -6px 12px var(--shadow-light),
        0 0 12px var(--blue-glow);
    }

    .neu-input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .neu-input:focus + .neu-input-icon {
      color: var(--blue-main);
    }

    /* Switche z rozbłyskiem Glow FX */
    .switch-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .neu-switch {
      position: relative;
      width: 64px;
      height: 34px;
      appearance: none;
      background: var(--card-bg);
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      transition: all 0.35s ease;
    }

    .neu-switch::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card-bg);
      box-shadow: 
        4px 4px 8px var(--shadow-dark),
        -2px -2px 6px var(--shadow-light);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }

    .neu-switch:hover::before {
      transform: scale(1.12);
    }

    .neu-switch:checked {
      background: var(--blue-main);
      box-shadow: 
        inset 2px 2px 4px rgba(0,0,0,0.3),
        0 0 16px var(--blue-glow);
    }

    .neu-switch:checked::before {
      transform: translateX(30px);
      background: #ffffff;
      box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.3);
    }

    .neu-switch:checked:hover::before {
      transform: translateX(30px) scale(1.12);
    }

    /* Radio Buttons */
    .radio-container {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .neu-radio {
      appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      cursor: pointer;
      outline: none;
      position: relative;
      box-shadow: 
        5px 5px 10px var(--shadow-dark),
        -5px -5px 10px var(--shadow-light);
      transition: all 0.25s ease;
    }

    .neu-radio:hover {
      transform: scale(1.08);
    }

    .neu-radio:checked {
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .neu-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--blue-main);
      box-shadow: 0 0 8px var(--blue-glow);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .neu-radio:checked::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .neu-radio:checked:hover::after {
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Interaktywne Pionowe Paski Postępu */
    .bars-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 160px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light);
    }

    .bar-track {
      position: relative;
      width: 28px;
      height: 100%;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      cursor: pointer;
    }

    .bar-fill {
      width: 100%;
      border-radius: 14px;
      background: var(--blue-gradient);
      box-shadow: 0 0 12px var(--blue-glow);
      transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Poziomy Wklęsły Suwak z Wypukłym Punktem i Tooltipem */
    .horizontal-slider-wrapper {
      margin-top: 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tooltip {
      position: absolute;
      top: -38px;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
      box-shadow: 
        4px 4px 8px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
      pointer-events: none;
      transition: left 0.1s ease;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 8px;
      height: 8px;
      background: var(--card-bg);
    }

    .slider-track-bg {
      position: relative;
      width: 100%;
      height: 16px;
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      display: flex;
      align-items: center;
      padding: 0 2px;
    }

    .slider-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      border-radius: 12px;
      background: var(--blue-light-gradient);
      box-shadow: 0 0 10px var(--blue-glow);
      pointer-events: none;
    }

    .neu-range-input {
      position: absolute;
      top: -4px;
      left: 0;
      width: 100%;
      height: 24px;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      z-index: 2;
    }

    .neu-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--card-bg);
      box-shadow: 
        4px 4px 8px var(--shadow-dark),
        -3px -3px 6px var(--shadow-light),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .neu-range-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 
        6px 6px 12px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
    }

    .neu-range-input::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: var(--card-bg);
      box-shadow: 
        4px 4px 8px var(--shadow-dark),
        -3px -3px 6px var(--shadow-light),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .neu-range-input::-moz-range-thumb:hover {
      transform: scale(1.2);
      box-shadow: 
        6px 6px 12px var(--shadow-dark),
        -4px -4px 8px var(--shadow-light);
    }
  </style>
</head>
<body>

  <div class="neu-card">
    <div class="header-bar">
      <div>
        <div class="logo" id="logoText">Tytuł</div>
        <p class="subtitle" id="subtitleText">Przykładowy styl strony</p>
      </div>

      <button class="neu-btn neu-btn-square" id="themeToggle" title="Zmień motyw">🌙</button>
    </div>

    <div class="ui-grid">
      <div class="ui-column">
        
        <div style="display: flex; gap: 12px;">
          <button class="neu-btn" style="flex: 1;">Przycisk</button>
          <button class="neu-btn neu-btn-square">&lt;</button>
          <button class="neu-btn neu-btn-square">&gt;</button>
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="neu-dropdown-wrapper" id="dropdownWrapper">
            <button class="neu-btn neu-dropdown-btn" id="dropdownBtn">
              <span id="dropdownLabel">Rozwijany panel</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="neu-dropdown-menu">
              <div class="dropdown-item" data-value="Opcja 1">Opcja 1</div>
              <div class="dropdown-item" data-value="Opcja 2">Opcja 2</div>
              <div class="dropdown-item" data-value="Opcja 3">Opcja 3</div>
              <div class="dropdown-item" data-value="Opcja 4">Opcja 4</div>
            </div>
          </div>
        </div>

        <div class="neu-input-wrapper">
          <input type="text" class="neu-input" placeholder="Wyszukaj ...">
          <span class="neu-input-icon">🔍</span>
        </div>

        <div class="switch-group" style="justify-content: space-between;">
          <div style="display: flex; gap: 12px;">
            <input type="checkbox" class="neu-switch">
            <input type="checkbox" class="neu-switch" checked>
          </div>

          <div class="radio-container">
            <input type="radio" name="neu-rad" class="neu-radio">
            <input type="radio" name="neu-rad" class="neu-radio" checked>
          </div>
        </div>

      </div>

      <div class="ui-column">
        
        <div class="bars-container" id="barsContainer">
          <div class="bar-track"><div class="bar-fill" style="height: 45%;"></div></div>
          <div class="bar-track"><div class="bar-fill" style="height: 75%;"></div></div>
          <div class="bar-track"><div class="bar-fill" style="height: 30%;"></div></div>
          <div class="bar-track"><div class="bar-fill" style="height: 90%;"></div></div>
          <div class="bar-track"><div class="bar-fill" style="height: 60%;"></div></div>
        </div>

        <div class="horizontal-slider-wrapper">
          <div class="tooltip" id="sliderTooltip">50%</div>
          <div class="slider-track-bg">
            <div class="slider-progress" id="sliderProgress"></div>
            <input type="range" min="0" max="100" value="50" class="neu-range-input" id="rangeInput">
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // 1. Animacja liter w napisach
    function animateText(elementId, baseDelay) {
      const el = document.getElementById(elementId);
      const text = el.innerText;
      el.innerHTML = '';
      
      [...text].forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerHTML = char === ' ' ? '&nbsp;' : char;
        span.style.animationDelay = `${baseDelay + (index * 0.035)}s`;
        el.appendChild(span);
      });
    }

    animateText('logoText', 0.2);
    animateText('subtitleText', 0.35);

    // 2. Obsługa Suwaka z Tooltipem
    const rangeInput = document.getElementById('rangeInput');
    const sliderProgress = document.getElementById('sliderProgress');
    const sliderTooltip = document.getElementById('sliderTooltip');

    function updateSlider() {
      const val = rangeInput.value;
      sliderProgress.style.width = `${val}%`;
      sliderTooltip.style.left = `${val}%`;
      sliderTooltip.textContent = `${val}%`;
    }

    rangeInput.addEventListener('input', updateSlider);
    updateSlider();

    // 3. Przełącznik Dark Mode z zapamiętywaniem w localStorage
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    let isDark = savedTheme === 'dark';

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      themeToggleBtn.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    applyTheme(isDark);

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
    });

    // 4. Interaktywność dla pionowych pasków
    const barTracks = document.querySelectorAll('.bar-track');
    barTracks.forEach(track => {
      track.addEventListener('click', () => {
        const fill = track.querySelector('.bar-fill');
        const randomHeight = Math.floor(Math.random() * 85) + 15;
        fill.style.height = `${randomHeight}%`;
      });
    });

    // 5. OBSŁUGA INTERAKTYWNEGO DROPDOWNA
    const dropdownWrapper = document.getElementById('dropdownWrapper');
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownLabel = document.getElementById('dropdownLabel');
    const dropdownItems = document.querySelectorAll('.dropdown-item');

    // Otwieranie / Zamykanie panelu
    dropdownBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownWrapper.classList.toggle('active');
    });

    // Wybór opcji z panelu
    dropdownItems.forEach(item => {
      item.addEventListener('click', () => {
        dropdownLabel.textContent = item.textContent.trim().replace(/^[\u{1F300}-\u{1F9FF}]\s*/u, '');
        dropdownWrapper.classList.remove('active');
      });
    });

    // Zamykanie przy kliknięciu w cokolwiek poza panelem
    document.addEventListener('click', (e) => {
      if (!dropdownWrapper.contains(e.target)) {
        dropdownWrapper.classList.remove('active');
      }
    });
  </script>

</body>
</html>
