<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Panel Nauczyciela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Zmienne dla motywu jasnego (Light Mode) */
    :root {
      --bg: #e6ecf5;
      --text-main: #4a5568;
      --text-muted: #8c9ba5;
      --blue-main: #2563eb;
      --blue-glow: rgba(37, 99, 235, 0.45);
      --green-main: #10b981;
      --green-glow: rgba(16, 185, 129, 0.45);
      --red-main: #ef4444;
      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
      --card-bg: #e6ecf5;
    }

    /* Zmienne dla motywu ciemnego (Dark Mode) */
    [data-theme="dark"] {
      --bg: #1e232a;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --blue-main: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.5);
      --green-main: #10b981;
      --green-glow: rgba(16, 185, 129, 0.5);
      --red-main: #f87171;
      --shadow-dark: rgba(15, 18, 22, 0.8);
      --shadow-light: rgba(45, 53, 64, 0.5);
      --card-bg: #1e232a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.3s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Karta Neumorficzna */
    .neu-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 
        16px 16px 32px var(--shadow-dark),
        -16px -16px 32px var(--shadow-light);
    }

    /* Top Bar Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: letterJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes letterJump {
      60% { transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Przyciski Neumorficzne */
    .neu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 18px;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      outline: none;
      box-shadow: 
        6px 6px 14px var(--shadow-dark),
        -6px -6px 14px var(--shadow-light);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, color 0.2s ease;
      user-select: none;
    }

    .neu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        10px 10px 20px var(--shadow-dark),
        -10px -10px 20px var(--shadow-light);
      color: var(--blue-main);
    }

    .neu-btn:active {
      transform: translateY(1px);
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light);
    }

    .neu-btn-danger:hover {
      color: var(--red-main);
    }

    .neu-btn-square {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 16px;
    }

    /* Układ Siatki */
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 32px;
    }

    @media (max-width: 900px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Sekcje */
    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Inputy i Formularze */
    .neu-input-wrapper {
      margin-bottom: 16px;
    }

    .neu-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      margin-left: 4px;
    }

    .neu-input, .neu-select {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid transparent;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
      transition: all 0.3s ease;
    }

    .neu-input:focus, .neu-select:focus {
      border-color: var(--blue-main);
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light),
        0 0 10px var(--blue-glow);
    }

    /* Listy i Elementy */
    .student-list, .requests-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: 
        6px 6px 14px var(--shadow-dark),
        -6px -6px 14px var(--shadow-light);
    }

    .student-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .student-name {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .student-stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--card-bg);
      color: var(--blue-main);
      box-shadow: 
        inset 2px 2px 4px var(--shadow-dark),
        inset -2px -2px 4px var(--shadow-light);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
      padding: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Górny Pasek (Nawigacja i Profil) -->
    <header class="neu-card header-bar">
      <div>
        <h1 class="logo" id="logoText">ClassQuest</h1>
        <p class="subtitle" id="teacherWelcome">Wczytywanie danych...</p>
      </div>

      <div class="header-actions">
        <button class="neu-btn neu-btn-square" id="themeToggle" title="Zmień motyw">🌙</button>
        <button class="neu-btn neu-btn-danger" id="logoutBtn">Wyloguj się 🚪</button>
      </div>
    </header>

    <!-- Główna zawartość -->
    <div class="grid-layout">
      
      <!-- Panel Lewy: Zarządzanie i Przyznawanie XP -->
      <div class="neu-card">
        <h2 class="section-title">⚡ Przyznaj Punkty XP</h2>
        
        <form id="add-xp-form">
          <div class="neu-input-wrapper">
            <label class="neu-label" for="student-select">Wybierz Ucznia</label>
            <select id="student-select" class="neu-select" required>
              <option value="">Ładowanie listy uczniów...</option>
            </select>
          </div>

          <div class="neu-input-wrapper">
            <label class="neu-label" for="xp-amount">Ilość XP</label>
            <input type="number" id="xp-amount" class="neu-input" placeholder="np. 50" min="1" required>
          </div>

          <div class="neu-input-wrapper">
            <label class="neu-label" for="xp-reason">Powód / Zadanie</label>
            <input type="text" id="xp-reason" class="neu-input" placeholder="np. Aktywność na lekcji" required>
          </div>

          <button type="submit" class="neu-btn" style="width: 100%; margin-top: 10px;">Dodaj XP ✨</button>
        </form>
      </div>

      <!-- Panel Prawy: Lista Uczniów Klasy -->
      <div class="neu-card">
        <h2 class="section-title">🏆 Ranking i Poziomy Klasy</h2>
        <div id="students-container" class="student-list">
          <div class="empty-state">Pobieranie listy uczniów...</div>
        </div>
      </div>

    </div>

    <!-- Sekcja Dodatkowa: Oczekujące Aktywności / Zgłoszenia -->
    <div class="neu-card">
      <h2 class="section-title">📥 Oczekujące Weryfikacje Zgłoszeń</h2>
      <div id="requests-container" class="requests-list">
        <div class="empty-state">Brak nowych zgłoszeń od uczniów.</div>
      </div>
    </div>
  </div>

  <script src="supabase.js"></script>

  <script>
    // 1. Animacja liter w logo
    function animateText(elementId, baseDelay) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const text = el.innerText;
      el.innerHTML = '';
      
      [...text].forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerHTML = char === ' ' ? '&nbsp;' : char;
        span.style.animationDelay = `${baseDelay + (index * 0.035)}s`;
        el.appendChild(span);
      });
    }

    animateText('logoText', 0.2);

    // 2. Obsługa Dark / Light Mode
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    let isDark = savedTheme === 'dark';

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      themeToggleBtn.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    applyTheme(isDark);

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
    });

    // 3. Główna logika Panelu Nauczyciela
    let currentTeacher = null;

    window.addEventListener('DOMContentLoaded', async () => {
      currentTeacher = getCurrentTeacher();

      if (!currentTeacher) {
        window.location.href = 'logowanie.html';
        return;
      }

      document.getElementById('teacherWelcome').textContent = `Witaj, ${currentTeacher.name}!`;

      await loadStudents();
      await loadPendingRequests();
    });

    // Ładowanie uczniów
    async function loadStudents() {
      const selectEl = document.getElementById('student-select');
      const containerEl = document.getElementById('students-container');

      try {
        const students = await getStudentsByTeacher(currentTeacher.id);

        if (!students || students.length === 0) {
          selectEl.innerHTML = '<option value="">Brak uczniów w klasie</option>';
          containerEl.innerHTML = '<div class="empty-state">Brak przypisanych uczniów.</div>';
          return;
        }

        // Sortowanie po XP (malejąco)
        students.sort((a, b) => (b.xp || 0) - (a.xp || 0));

        // Wypełnianie Selecta
        selectEl.innerHTML = '<option value="">-- Wybierz Ucznia --</option>' + 
          students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

        // Wypełnianie Listy
        containerEl.innerHTML = students.map((s, idx) => {
          const level = Math.floor((s.xp || 0) / 100) + 1;
          return `
            <div class="list-item">
              <div class="student-info">
                <span class="student-name">#${idx + 1} ${s.name}</span>
                <span class="student-stats">${s.xp || 0} XP • Poziom ${level}</span>
              </div>
              <span class="badge">Poziom ${level}</span>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Błąd podczas ładowania uczniów:", err);
        containerEl.innerHTML = '<div class="empty-state" style="color: var(--red-main)">Nie udało się pobrać listy uczniów.</div>';
      }
    }

    // Dodawanie XP
    document.getElementById('add-xp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const studentId = document.getElementById('student-select').value;
      const amount = parseInt(document.getElementById('xp-amount').value, 10);
      const reason = document.getElementById('xp-reason').value.trim();

      if (!studentId || isNaN(amount) || !reason) return;

      try {
        await addXpToStudent(studentId, amount, reason);
        document.getElementById('xp-amount').value = '';
        document.getElementById('xp-reason').value = '';
        await loadStudents();
      } catch (err) {
        console.error("Błąd dodawania XP:", err);
      }
    });

    // Ładowanie oczekujących zgłoszeń
    async function loadPendingRequests() {
      const containerEl = document.getElementById('requests-container');
      try {
        const requests = await getPendingRequests(currentTeacher.id);

        if (!requests || requests.length === 0) {
          containerEl.innerHTML = '<div class="empty-state">Brak nowych zgłoszeń od uczniów.</div>';
          return;
        }

        containerEl.innerHTML = requests.map(req => `
          <div class="list-item">
            <div class="student-info">
              <span class="student-name">${req.student_name}</span>
              <span class="student-stats">${req.task_name} (+${req.xp_reward} XP)</span>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="neu-btn" style="padding: 8px 14px;" onclick="handleApprove('${req.id}', '${req.student_id}', ${req.xp_reward})">Zatwierdź 👍</button>
              <button class="neu-btn neu-btn-danger" style="padding: 8px 14px;" onclick="handleReject('${req.id}')">Odrzuć ❌</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Błąd ładowania zgłoszeń:", err);
      }
    }

    async function handleApprove(requestId, studentId, xp) {
      await approveRequest(requestId, studentId, xp);
      await loadStudents();
      await loadPendingRequests();
    }

    async function handleReject(requestId) {
      await rejectRequest(requestId);
      await loadPendingRequests();
    }

    // Wylogowanie
    document.getElementById('logoutBtn').addEventListener('click', () => {
      logoutTeacher();
      window.location.href = 'logowanie.html';
    });
  </script>
</body>
</html>
