<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie nauczyciela — ClassQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .auth-card { animation: cardEnter .55s var(--ease-smooth) both; }
    .alert { padding: 12px 16px; border-radius: 16px; font-weight: 700; font-size: .88rem; display: none; }
    .alert.show { display: block; animation: pop .3s var(--ease-bounce); }
    .alert.err { background: var(--red-soft); color: var(--red); box-shadow: inset 2px 2px 5px var(--shadow-dark-soft); }
    .alert.ok { background: var(--green-soft); color: var(--green); }
    .alert.info { background: var(--blue-soft); color: var(--blue); }
    .demo-box { margin-top: 22px; padding: 14px 16px; border-radius: 18px; box-shadow: inset 4px 4px 9px var(--shadow-dark-soft), inset -4px -4px 9px var(--shadow-light); font-size: .82rem; }
    .demo-box code { background: var(--bg-deep); padding: 2px 7px; border-radius: 7px; font-weight: 800; }
  </style>
</head>
<body>

<div class="auth-layout">
  <div class="neu-card auth-card">
    <div class="row-between mb-16">
      <a class="brand" href="index.html"><span class="brand-mark">🎲</span><span>ClassQuest<small>panel nauczyciela</small></span></a>
      <button class="neu-btn square icon-only" data-theme-toggle title="Zmień motyw">🌙</button>
    </div>

    <h1 id="title" style="font-size:1.7rem">Zaloguj się</h1>
    <p class="muted semi small mt-8" id="subtitle">Potem przejdziesz od razu do prowadzenia gry na lekcji.</p>

    <div class="tabs mt-24" role="tablist">
      <button class="tab-btn active" data-mode="login" type="button">Logowanie</button>
      <button class="tab-btn" data-mode="register" type="button">Rejestracja</button>
    </div>

    <div class="alert err mt-16" id="alert"></div>

    <form id="auth-form" class="mt-16" autocomplete="on">
      <div class="field">
        <label for="login">Imię i nazwisko lub e-mail</label>
        <input class="neu-input" id="login" name="login" placeholder="np. Anna Kowalczyk" autocomplete="username" required>
      </div>

      <div class="field hidden" id="row-email">
        <label for="email">E-mail (opcjonalnie)</label>
        <input class="neu-input" id="email" name="email" type="email" placeholder="anna.kowalczyk@szkola.pl" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Hasło</label>
        <input class="neu-input" id="password" name="password" type="password" placeholder="••••••" autocomplete="current-password" required>
      </div>

      <div class="field hidden" id="row-subject">
        <label for="subject">Wiodący przedmiot</label>
        <input class="neu-input" id="subject" name="subject" placeholder="np. matematyka">
      </div>

      <button class="neu-btn primary block lg mt-8" id="submit" type="submit">Zaloguj się</button>
    </form>

    <div class="demo-box">
      <b>Konto demonstracyjne:</b> login <code>Anna Kowalczyk</code>, hasło <code>demo123</code>.<br>
      <span class="muted">Możesz też założyć własne konto — dane zostają w tej przeglądarce, dopóki nie włączysz serwera klasy lub Supabase.</span>
      <div class="row-8 wrap mt-16">
        <button class="neu-btn sm" id="fillDemo" type="button">Wypełnij dane demo</button>
        <a class="neu-btn sm ghost" href="gra.html">Gram jako uczeń →</a>
      </div>
    </div>

    <p class="tiny muted center mt-16" id="mode-line"></p>
  </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script type="module">
  const { ui } = CQ;
  let mode = 'login';
  const $ = (s) => document.querySelector(s);
  const alertBox = $('#alert');

  document.querySelectorAll('[data-theme-toggle]').forEach((b) => b.addEventListener('click', () => ui.applyTheme(!ui.isDark())));
  ui.animateText('#title', 0.15, 0.03);

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    $('#row-email').classList.toggle('hidden', mode === 'login');
    $('#row-subject').classList.toggle('hidden', mode === 'login');
    $('#title').textContent = mode === 'login' ? 'Zaloguj się' : 'Załóż konto nauczyciela';
    $('#subtitle').textContent = mode === 'login'
      ? 'Potem przejdziesz od razu do prowadzenia gry na lekcji.'
      : 'Konto trzyma Twoje klasy, bank pytań i wyniki gier.';
    $('#submit').textContent = mode === 'login' ? 'Zaloguj się' : 'Zarejestruj się i przejdź do panelu';
    $('#password').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
    hideAlert();
  }

  document.querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  function showAlert(msg, type = 'err') {
    alertBox.className = `alert show ${type}`;
    alertBox.textContent = msg;
  }
  function hideAlert() { alertBox.className = 'alert'; }

  $('#fillDemo').addEventListener('click', () => {
    setMode('login');
    $('#login').value = 'Anna Kowalczyk';
    $('#password').value = 'demo123';
  });

  await CQ.store.ready().catch((e) => showAlert('Nie da się wczytać danych: ' + e.message));
  $('#mode-line').innerHTML = `Tryb danych: <b>${CQ.store.modeLabel}</b> · wersja ${CQ.wersja}`;

  if (CQ.Auth.current() && CQ.Auth.current().rola !== 'admin') location.replace('nauczyciel.html');

  $('#auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();
    const btn = $('#submit');
    const login = $('#login').value.trim();
    const haslo = $('#password').value;
    if (!login || !haslo) return showAlert('Uzupełnij login i hasło.');
    if (mode === 'register' && haslo.length < 5) return showAlert('Hasło musi mieć co najmniej 5 znaków.');

    btn.classList.add('spin');
    btn.disabled = true;
    try {
      if (mode === 'register') {
        await CQ.Auth.register({
          imieNazwisko: login, email: $('#email').value.trim(), haslo, przedmiot: $('#subject').value.trim(),
        });
        ui.toast('Konto utworzone. Witaj w ClassQuest!', 'ok');
      } else {
        const me = await CQ.Auth.login({ login, haslo });
        if (me.rola === 'admin') { location.replace('admin.html'); return; }
        ui.toast(`Cześć, ${me.imie_nazwisko.split(' ')[0]}!`, 'ok', 1800);
      }
      location.replace('nauczyciel.html');
    } catch (err) {
      showAlert(err.message || 'Coś poszło nie tak.');
      btn.classList.remove('spin');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
