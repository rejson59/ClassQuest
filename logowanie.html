<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Logowanie Nauczyciela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Zmienne dla motywu jasnego (Light Mode) */
    :root {
      --bg: #e6ecf5;
      --text-main: #4a5568;
      --text-muted: #8c9ba5;
      --blue-main: #2563eb;
      --blue-glow: rgba(37, 99, 235, 0.45);
      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
      --card-bg: #e6ecf5;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-text: #dc2626;
    }

    /* Zmienne dla motywu ciemnego (Dark Mode) */
    [data-theme="dark"] {
      --bg: #1e232a;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --blue-main: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.5);
      --shadow-dark: rgba(15, 18, 22, 0.8);
      --shadow-light: rgba(45, 53, 64, 0.5);
      --card-bg: #1e232a;
      --error-bg: rgba(239, 68, 68, 0.2);
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.3s ease;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Karta Główna */
    .neu-card {
      background: var(--card-bg);
      border-radius: 36px;
      padding: 48px 42px;
      width: 100%;
      max-width: 480px;
      
      box-shadow: 
        25px 25px 50px var(--shadow-dark),
        -25px -25px 50px var(--shadow-light);

      opacity: 0;
      transform: translate(-30px, -30px) scale(0.96);
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    /* Nagłówek */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: letterJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes letterJump {
      60% { transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Formularz */
    .form-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .neu-input-wrapper {
      position: relative;
      width: 100%;
    }

    .neu-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      border-radius: 20px;
      border: 1px solid transparent;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light);

      transition: all 0.3s ease;
    }

    .neu-input::placeholder {
      color: var(--text-muted);
    }

    .neu-input:focus {
      border-color: var(--blue-main);
      box-shadow: 
        inset 6px 6px 12px var(--shadow-dark),
        inset -6px -6px 12px var(--shadow-light),
        0 0 12px var(--blue-glow);
    }

    .neu-input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .neu-input:focus + .neu-input-icon {
      color: var(--blue-main);
    }

    /* Przycisk Akcji */
    .neu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      outline: none;
      
      box-shadow: 
        8px 8px 16px var(--shadow-dark),
        -8px -8px 16px var(--shadow-light);

      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, color 0.2s ease;
      user-select: none;
      margin-top: 10px;
    }

    .neu-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light);
      color: var(--blue-main);
    }

    .neu-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .neu-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .neu-btn-square {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 16px;
      flex-shrink: 0;
    }

    /* Przełącznik trybu (Logowanie / Rejestracja) */
    .toggle-box {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .toggle-link {
      color: var(--blue-main);
      cursor: pointer;
      margin-left: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    /* Komunikat Błędu */
    .error-msg {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
      box-shadow: 
        inset 2px 2px 5px var(--shadow-dark),
        inset -2px -2px 5px var(--shadow-light);
    }
  </style>
</head>
<body>

  <div class="neu-card">
    <div class="header-bar">
      <div>
        <div class="logo" id="logoText">ClassQuest</div>
        <p class="subtitle" id="subtitleText">Panel Nauczyciela</p>
      </div>

      <button class="neu-btn neu-btn-square" id="themeToggle" title="Zmień motyw">🌙</button>
    </div>

    <div id="error-box" class="error-msg"></div>

    <form class="form-container" id="auth-form">
      <div class="neu-input-wrapper">
        <input type="text" id="name" class="neu-input" placeholder="Imię i Nazwisko" required autocomplete="username">
        <span class="neu-input-icon">👤</span>
      </div>

      <div class="neu-input-wrapper">
        <input type="password" id="password" class="neu-input" placeholder="Hasło" required autocomplete="current-password">
        <span class="neu-input-icon">🔒</span>
      </div>

      <button type="submit" id="submit-btn" class="neu-btn">Zaloguj się</button>
    </form>

    <div class="toggle-box">
      <span id="toggle-text">Nie masz jeszcze konta?</span>
      <a class="toggle-link" id="toggle-link">Zarejestruj się</a>
    </div>
  </div>

  <script src="supabase.js"></script>

  <script>
    // 1. Animacja liter w tytułach
    function animateText(elementId, baseDelay) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const text = el.innerText;
      el.innerHTML = '';
      
      [...text].forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerHTML = char === ' ' ? '&nbsp;' : char;
        span.style.animationDelay = `${baseDelay + (index * 0.035)}s`;
        el.appendChild(span);
      });
    }

    animateText('logoText', 0.2);
    animateText('subtitleText', 0.35);

    // 2. Przełącznik Dark Mode z zapisem w localStorage
    const themeToggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    let isDark = savedTheme === 'dark';

    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      themeToggleBtn.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    applyTheme(isDark);

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
    });

    // 3. Logika Logowania i Rejestracji z Supabase
    let isRegisterMode = false;

    const subtitleText = document.getElementById('subtitleText');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleLink = document.getElementById('toggle-link');
    const errorBox = document.getElementById('error-box');
    const authForm = document.getElementById('auth-form');

    // Auto-przekierowanie jeśli zalogowany
    window.addEventListener('DOMContentLoaded', () => {
      const activeTeacher = getCurrentTeacher();
      if (activeTeacher) {
        window.location.href = 'nauczyciel.html';
      }
    });

    // Przełączanie trybów
    toggleLink.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      hideError();

      if (isRegisterMode) {
        subtitleText.textContent = 'Nowe Konto Nauczyciela';
        submitBtn.textContent = 'Zarejestruj się';
        toggleText.textContent = 'Masz już konto?';
        toggleLink.textContent = 'Zaloguj się';
      } else {
        subtitleText.textContent = 'Panel Nauczyciela';
        submitBtn.textContent = 'Zaloguj się';
        toggleText.textContent = 'Nie masz jeszcze konta?';
        toggleLink.textContent = 'Zarejestruj się';
      }
      
      animateText('subtitleText', 0.05);
    });

    // Wysyłanie formularza
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !password) {
        showError('Proszę wypełnić wszystkie pola.');
        return;
      }

      setLoading(true);

      try {
        if (isRegisterMode) {
          const result = await registerTeacher(name, password);
          if (result.error) {
            showError('Błąd rejestracji: ' + result.error);
          } else {
            window.location.href = 'nauczyciel.html';
          }
        } else {
          const result = await loginTeacher(name, password);
          if (result.error) {
            showError(result.error);
          } else {
            window.location.href = 'nauczyciel.html';
          }
        }
      } catch (err) {
        showError('Wystąpił nieoczekiwany błąd. Spróbuj ponownie.');
        console.error(err);
      } finally {
        setLoading(false);
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading 
        ? (isRegisterMode ? 'Rejestrowanie...' : 'Logowanie...') 
        : (isRegisterMode ? 'Zarejestruj się' : 'Zaloguj się');
    }
  </script>
</body>
</html>
