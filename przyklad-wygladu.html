<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podgląd komponentów — ClassQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
    .demo-box > .label { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  </style>
</head>
<body>
<div class="container">
  <div class="page-head row-between wrap">
    <div>
      <h1 id="tytul">Podgląd komponentów</h1>
      <p>Ta strona pokazuje wszystkie elementy interfejsu ClassQuest w jednym miejscu — przydaje się, gdy chcesz coś
        dopisać do własnej strony i nie wiedzieć, jak to nazwać. Klasy są w <code>assets/css/base.css</code>.</p>
    </div>
    <div class="row-8">
      <button class="neu-btn sm" id="losuj">🎲 Losuj przykłady</button>
      <a class="neu-btn sm" href="index.html">Start</a>
    </div>
  </div>

  <div class="demo-grid" id="grid"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script type="module">
  const { ui } = CQ;
  await CQ.store.ready();

  const boxes = [
    ['Przyciski', `
      <div class="row-8 wrap">
        <button class="neu-btn primary">Podstawowy</button>
        <button class="neu-btn">Zwykły</button>
        <button class="neu-btn success">Zatwierdź</button>
        <button class="neu-btn danger">Usuwaj</button>
        <button class="neu-btn danger-solid">Skasuj</button>
        <button class="neu-btn ghost">Ghost</button>
        <button class="neu-btn sm">Mały</button>
        <button class="neu-btn lg">Duży</button>
        <button class="neu-btn square">✦</button>
        <button class="neu-btn primary spin">…</button>
        <button class="neu-btn" disabled>Nieaktywny</button>
      </div>`],
    ['Pola formularza', `
      <div class="field"><label class="neu-label">Tekst</label><input class="neu-input" placeholder="Imię i nazwisko"></div>
      <div class="field"><label class="neu-label">Kod pokoju</label><input class="neu-input mono-code" value="246810"></div>
      <div class="field"><label class="neu-label">Lista</label><div class="select-wrap"><select class="neu-select"><option>5A</option><option>7B</option></select></div></div>
      <div class="field"><label class="neu-label">Obszerne pole</label><textarea class="neu-textarea" rows="3" placeholder="Treść pytania…"></textarea></div>
      <label class="switch"><input type="checkbox" checked><span class="track"><span class="thumb"></span></span>Przełącznik</label>`],
    ['Odznaki i statusy', `
      <div class="row-8 wrap">
        ${ui.statusBadge('lobby')}${ui.statusBadge('pytanie')}${ui.statusBadge('podsumowanie')}${ui.statusBadge('koniec')}
        <span class="badge">neutralna</span><span class="badge blue">info</span><span class="badge green">OK</span>
        <span class="badge amber">czeka</span><span class="badge red">błąd</span>${ui.levelBadge(1340)}
      </div>`],
    ['Pola odpowiedzi (gra)', `
      <div class="answer-grid">
        <button class="answer-btn" data-opt="A"><span class="key">A</span><span class="grow">3/4</span></button>
        <button class="answer-btn correct" data-opt="B"><span class="key">B</span><span class="grow">2/6</span><span class="fx">+1 240<small>4,1 s</small></span></button>
        <button class="answer-btn wrong" data-opt="C"><span class="key">C</span><span class="grow">1/8</span><span class="fx">✕</span></button>
        <button class="answer-btn" data-opt="D" disabled><span class="key">D</span><span class="grow">2/4</span></button>
      </div>`],
    ['Statystyki i paski', `
      <div class="grid-2" style="gap:12px">
        <div class="stat"><div class="label">Średnia klasy</div><div class="value">72%</div><div class="hint">18 uczniów · 6 gier</div></div>
        <div class="stat"><div class="label">Rozdane XP</div><div class="value">12 480</div><div class="hint">w tym 3 200 z gier</div></div>
      </div>
      <div class="mt-16 stack stack-8">
        <div class="progress"><i style="width:64%"></i></div>
        <div class="progress green"><i style="width:81%"></i></div>
        <div class="progress amber"><i style="width:43%"></i></div>
        <div class="progress red"><i style="width:17%"></i></div>
      </div>`],
    ['Wykres pytań', `
      <div class="bar-chart">
        <div class="bar-row"><span>Pytanie 1</span><span class="bar"><i class="good" style="width:88%"></i></span><span class="val">88%</span></div>
        <div class="bar-row"><span>Pytanie 2</span><span class="bar"><i style="width:61%"></i></span><span class="val">61%</span></div>
        <div class="bar-row"><span>Pytanie 3</span><span class="bar"><i class="bad" style="width:23%"></i></span><span class="val">23%</span></div>
      </div>`],
    ['Lista i wiersz', `
      <div class="list">
        <div class="list-item"><span class="lead">1</span><div class="body"><strong>Jan Kowalski</strong><small>1 240 XP · poziom 4</small></div><span class="badge blue">gra teraz</span></div>
        <div class="list-item"><span class="lead green">✓</span><div class="body"><strong>Anna Nowak</strong><small>zatwierdzone zgłoszenie · +40 XP</small></div><button class="neu-btn sm">Szczegóły</button></div>
        <div class="list-item"><span class="lead amber">!</span><div class="body"><strong>Piotr Wiśniewski</strong><small>oczekuje na weryfikację</small></div><button class="neu-btn sm primary">Zatwierdź</button></div>
      </div>`],
    ['Ranking i podium', `
      <div class="podium mb-16">
        ${[1, 2, 3].map((i) => `<div class="place p${i}"><div class="medal">${['🥇', '🥈', '🥉'][i - 1]}</div><div class="name">Uczeń ${i}</div><div class="pts">${(4 - i) * 1320} pkt</div></div>`).join('')}
      </div>
      <div class="rank-row top1"><span class="pos">1</span><span class="grow semi">Ada Testówna</span><span class="pts">5 240</span></div>
      <div class="rank-row"><span class="pos">4</span><span class="grow semi">Bartosz Lis</span><span class="pts">3 100</span></div>`],
    ['Awatar i wybór', `
      <div class="row-16">
        <div>${ui.avatar('Ada', '#2563eb', '🎓', 'bounce')}</div>
        <div class="stack stack-8 grow">
          <div class="row-8 wrap">${CQ.PALETTE.slice(0, 6).map((c, i) => `<button class="swatch ${i === 2 ? 'selected' : ''}" style="background:${c};color:${c}"></button>`).join('')}</div>
          <div class="row-8 wrap">${['🎓', '👑', '🚀', '🎧', '❌'].map((h, i) => `<button class="chip-btn ${i === 0 ? 'selected' : ''}">${h}</button>`).join('')}</div>
        </div>
      </div>`],
    ['Licznik', `
      <div class="row-16" id="ringi"></div>
      <p class="tiny muted mt-8">Ten sam element co na tablicy i w grze — malejący łuk zmienia kolor przy 50% i 25% czasu.</p>`],
    ['Tabela', `
      <div class="table-wrap"><table class="data">
        <thead><tr><th>#</th><th>Uczeń</th><th>Punkty</th><th>Poprawne</th><th></th></tr></thead>
        <tbody>
          <tr><td class="num">1</td><td><b>Ada Testówna</b></td><td class="num">5 240</td><td class="num">9/10</td><td><button class="neu-btn square sm">✨</button></td></tr>
          <tr><td class="num">2</td><td><b>Bartosz Lis</b></td><td class="num">4 100</td><td class="num">8/10</td><td><button class="neu-btn square sm">✨</button></td></tr>
        </tbody></table></div>`],
    ['Puste stany', `
      ${ui.empty('🎈', 'Nikt jeszcze nie dołączył', 'Podyktuj kod pokoju klasie.', '<button class="neu-btn sm primary">Kopiuj kod</button>')}`],
    ['Akordeon i kbd', `
      <details class="acc" open><summary>Jak liczone są punkty?</summary><div class="acc-body small muted">Baza × trudność + bonus za pozostały czas, razy premia za serię.</div></details>
      <details class="acc"><summary>Skróty klawiszowe</summary><div class="acc-body small"><kbd>Spacja</kbd> faza dalej · <kbd>N</kbd> następne · <kbd>R</kbd> wynik · <kbd>1</kbd>–<kbd>4</kbd> odpowiedź</div></details>`],
    ['Taby i skeleton', `
      <div class="tabs mb-16"><button class="tab-btn active">Nauczyciel</button><button class="tab-btn">Uczeń</button><button class="tab-btn">Admin</button></div>
      <div class="stack stack-8"><div class="skeleton" style="height:42px"></div><div class="skeleton" style="height:42px;width:70%"></div></div>`],
  ];

  document.getElementById('grid').innerHTML = boxes.map(([tytul, tresc]) =>
    `<section class="neu-card card-enter"><div class="label">${tytul}</div>${tresc}</section>`).join('');

  const ringi = document.getElementById('ringi');
  const r1 = ui.timerRing(14); const r2 = ui.timerRing(7); const r3 = ui.timerRing(2);
  ringi.append(r1, r2, r3);
  r2.setValue(0.35, 7); r3.setValue(0.12, 2);
  let f = 1;
  setInterval(() => { f = (f + 0.01) % 1; r1.setValue(1 - f, Math.round((1 - f) * 20)); }, 120);

  document.getElementById('losuj').addEventListener('click', () => {
    ui.toast('Wylosowano przykładowe wartości.', 'ok');
    document.querySelectorAll('.progress > i').forEach((b) => b.style.width = (10 + Math.random() * 88).toFixed(0) + '%');
    document.querySelectorAll('.bar-chart .bar > i').forEach((b) => b.style.width = (10 + Math.random() * 88).toFixed(0) + '%');
    document.querySelectorAll('.bar-chart .val').forEach((v) => v.textContent = (10 + Math.random() * 88).toFixed(0) + '%');
  });
  ui.animateText('#tytul', 0.15, 0.03);
</script>
</body>
</html>
