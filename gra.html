<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gra — ClassQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { padding-bottom: 40px; }
    .game-wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 60px; }
    .game-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .phase-card { padding: 26px 22px; }
    .opt { position: relative; }
    .opt .lock { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: .8rem; color: var(--text-muted); font-weight: 800; }
    .score-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .score-strip .cell { text-align: center; padding: 12px 6px; border-radius: 16px; box-shadow: inset 4px 4px 8px var(--shadow-dark-soft), inset -4px -4px 8px var(--shadow-light); }
    .score-strip .v { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .score-strip .l { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--text-muted); }
    .feedback { text-align: center; padding: 26px 20px; border-radius: 24px; }
    .feedback.good { background: var(--green-soft); }
    .feedback.bad { background: var(--red-soft); }
    .feedback .big { font-size: 2.6rem; line-height: 1; }
    .mini-rank { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .mini-rank .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 13px; font-weight: 700; font-size: .88rem; box-shadow: 4px 4px 9px var(--shadow-dark-soft), -4px -4px 9px var(--shadow-light); }
    .mini-rank .row.me { color: var(--blue); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
    .lobby-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 8px; }
    .lobby-list .p { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-radius: 14px; font-weight: 700; font-size: .87rem; box-shadow: 5px 5px 10px var(--shadow-dark-soft), -5px -5px 10px var(--shadow-light); }
    .lobby-list .avatar { transform: scale(.55); margin: -6px -10px; }
    .dots::after { content: ''; animation: d 1.4s steps(4) infinite; }
    @keyframes d { 0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'} }
    .team-pick { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .team-pick .t { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-radius: 16px; cursor: pointer; font-weight: 800; box-shadow: 5px 5px 10px var(--shadow-dark-soft), -5px -5px 10px var(--shadow-light); }
    .team-pick .t input { accent-color: var(--blue); }
    .team-pick .t.on { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
    .streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--amber); }
  </style>
</head>
<body>
<div class="game-wrap">
  <div class="game-head">
    <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>ClassQuest<small>tryb gracza</small></span></a>
    <div class="row-8">
      <span id="who"></span>
      <button class="neu-btn square icon-only" data-theme-toggle>🌙</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script type="module">
  const { ui } = CQ;
  const $ = (s) => document.querySelector(s);
  const view = document.getElementById('view');
  await CQ.store.ready();
  document.querySelectorAll('[data-theme-toggle]').forEach((b) => b.addEventListener('click', () => ui.applyTheme(!ui.isDark())));

  const LS_ME = 'cq_gracz_v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(LS_ME) || 'null'); } catch (e) { return null; } };
  const write = (o) => localStorage.setItem(LS_ME, JSON.stringify(o));
  let me = read();              // {gracz_id, sesja_id, kod, nazwa}
  let trening = null;           // {zestaw_id, indeks, dobre, zle, punkty, pytania, odpowiedzi:{}}
  let sig = null;
  let ring = null, ticker = null, feedbackToastShown = null;

  const paramKod = new URLSearchParams(location.search).get('kod');
  const paramTrening = new URLSearchParams(location.search).get('trening');
  const pendingKod = paramKod || null;

  /** Klucz widoku — jeśli się nie zmienił, nie przerysowujemy (inaczej
   *  skasowalibyśmy wpisywaną właśnie odpowiedź albo animacje). */
  function widokKlucz() {
    if (trening) {
      const t = trening;
      return 'trening:' + t.indeks + ':' + Object.keys(t.odpowiedzi).length + (t.indeks >= t.pytania.length ? ':end' : '');
    }
    if (!me || !CQ.store.byId('gracze', me.gracz_id)) return 'join';
    const gracz = CQ.store.byId('gracze', me.gracz_id);
    const sesja = CQ.store.byId('sesje', gracz.sesja_id);
    if (!sesja) return 'join';
    return ['sesja', sesja.id, sesja.status, sesja.indeks,
      CQ.Gra.odpowiedzi(sesja.id, gracz.id).length, CQ.Gra.gracze(sesja.id).length].join(':');
  }

  /* ============================ WIDOK: DOŁĄCZANIE ======================== */
  function renderJoin(errMsg) {
    const zestawy = CQ.store.table('zestawy').filter((z) => CQ.Zestawy.pytania(z.id).length);
    const klasy = CQ.store.table('klasy');
    view.innerHTML = `
      <div class="neu-card phase-card card-enter">
        <h1 style="font-size:1.7rem">Dołącz do gry</h1>
        <p class="muted small mt-8">Wpisz 6-cyfrowy kod z tablicy. Nic nie trzeba instalować ani zakładać — gracie na swoim telefonie albo laptopie.</p>
        ${errMsg ? `<div class="mt-16 tiny" style="color:var(--red);font-weight:800">⚠️ ${ui.esc(errMsg)}</div>` : ''}
        <form id="join-form" class="mt-24">
          <div class="field"><label class="neu-label" for="kod">Kod gry</label>
            <input class="neu-input mono-code" id="kod" inputmode="numeric" maxlength="6" placeholder="246810" value="${ui.esc(pendingKod || '')}" autocomplete="off"></div>
          <div class="field"><label class="neu-label" for="klasa">Klasa (po to dobierzemy Twoje nazwisko)</label>
            <div class="select-wrap"><select class="neu-select" id="klasa">
              <option value="">— wybierz —</option>
              ${klasy.map((k) => `<option value="${k.id}">${ui.esc(k.nazwa)}${k.opis ? ' · ' + ui.esc(k.opis) : ''}</option>`).join('')}
            </select></div></div>
          <div class="field"><label class="neu-label" for="nazwa">Kim jesteś?</label>
            <div class="select-wrap"><select class="neu-select" id="nazwa"><option value="">— najpierw klasa —</option></select></div>
            <div class="tiny muted mt-8">Nie ma Cię na liście? Przełącz na wpis ręczny.</div>
            <div class="row-8 mt-8"><button type="button" class="neu-btn sm" id="manual">Wpiszę nazwisko ręcznie</button></div>
            <input class="neu-input hidden mt-8" id="manual-name" placeholder="np. Kuba 4B">
          </div>
          <div class="field"><label class="neu-label">Awatar</label>
            <div class="row-16" style="align-items:flex-start">
              <div id="av-prev" style="width:70px">${ui.avatar('', '#2563eb', '🎓')}</div>
              <div class="grow stack stack-8">
                <div class="row-8 wrap" id="colors">${CQ.PALETTE.map((c, i) => `<button type="button" class="swatch ${i === 0 ? 'selected' : ''}" data-color="${c}" style="background:${c};color:${c}"></button>`).join('')}</div>
                <div class="row-8 wrap" id="hats">${['🎓', '👑', '🚀', '🎧', '🦄', '⚡'].map((h, i) => `<button type="button" class="chip-btn ${i === 0 ? 'selected' : ''}" data-hat="${h}">${h}</button>`).join('')}</div>
              </div>
            </div>
          </div>
          <div class="field hidden" id="team-field"><label class="neu-label">Drużyna</label>
            <div class="team-pick" id="teams">${CQ.ZESPOLY.map((t, i) => `
              <label class="t ${i === 0 ? 'on' : ''}" style="border-bottom:4px solid ${t.kolor}">
                <input type="radio" name="zespol" value="${i}" ${i === 0 ? 'checked' : ''}> ${t.emoji} ${t.nazwa}</label>`).join('')}</div></div>
          <button class="neu-btn primary block lg" type="submit">Wchodzę do gry 🎮</button>
        </form>
      </div>

      <div class="neu-card phase-card mt-16">
        <div class="section-title">🧘 Trening solo <small>bez kodu, bez presji, bez XP</small></div>
        ${zestawy.length ? `<div class="list tight">${zestawy.slice(0, 5).map((z) => `
          <div class="list-item clickable" data-trening="${z.id}">
            <span class="lead">${CQ.Zestawy.pytania(z.id).length}</span>
            <div class="body"><strong>${ui.esc(z.nazwa_zestawu)}</strong><small>${ui.esc(z.przedmiot || 'zestaw')} · ${ui.esc(z.opis || '').slice(0, 60)}</small></div>
            <span class="badge blue">trenuj →</span>
          </div>`).join('')}</div>` : ui.empty('❓', 'Brak zestawów', 'Nauczyciel musi dodać pytania, żeby trening był dostępny.')}
      </div>`;

    const selKlasa = $('#klasa'), selNazwa = $('#nazwa'), manual = $('#manual-name');
    let color = CQ.PALETTE[0], hat = '🎓';

    function fillStudents() {
      const list = selKlasa.value ? CQ.Klasy.uczniowie(selKlasa.value) : [];
      selNazwa.innerHTML = list.length
        ? '<option value="">— wskaż siebie —</option>' + list.map((u) => `<option value="${u.id}" data-nazwa="${ui.esc(u.nazwa)}" data-kolor="${u.kolor}" data-hat="${u.nakrycie}">${u.numer || ''}. ${ui.esc(u.nazwa)}</option>`).join('')
        : '<option value="">— najpierw klasa —</option>';
      selNazwa.disabled = !list.length;
      manual.classList.toggle('hidden', list.length > 0);
      $('#manual').classList.toggle('hidden', list.length > 0);
    }
    selKlasa.addEventListener('change', () => {
      fillStudents();
      const k = CQ.store.byId('klasy', selKlasa.value);
      if (k && k.kod) $('#kod').focus();
    });
    selNazwa.addEventListener('change', () => {
      const o = selNazwa.selectedOptions[0];
      if (o && o.dataset.kolor) { color = o.dataset.kolor; hat = o.dataset.hat || hat; repaintAvatar(); }
    });
    $('#manual').addEventListener('click', () => { manual.classList.remove('hidden'); selNazwa.classList.add('hidden'); manual.focus(); });
    $('#colors').addEventListener('click', (e) => { const b = e.target.closest('[data-color]'); if (!b) return; color = b.dataset.color; $$('#colors .swatch').forEach((x) => x.classList.toggle('selected', x === b)); repaintAvatar(); });
    $('#hats').addEventListener('click', (e) => { const b = e.target.closest('[data-hat]'); if (!b) return; hat = b.dataset.hat; $$('#hats .chip-btn').forEach((x) => x.classList.toggle('selected', x === b)); repaintAvatar(); });
    $('#teams').addEventListener('change', () => $$('#teams .t').forEach((x) => x.classList.toggle('on', x.querySelector('input').checked)));
    function repaintAvatar() { $('#av-prev').innerHTML = ui.avatar(manual.value || 'Ja', color, hat); }
    manual.addEventListener('input', repaintAvatar);

    // podpowiedź z aktywnego kodu
    const open = CQ.store.table('sesje').filter((s) => s.status !== 'koniec').sort((a, b) => String(b.utworzono).localeCompare(String(a.utworzono)))[0];
    if (open && !$('#kod').value) $('#kod').placeholder = open.kod + ' (ostatni aktywny)';
    if (open) {
      $('#team-field').classList.toggle('hidden', open.tryb !== 'druzyny');
      $('#klasa').value = open.klasa_id || '';
      fillStudents();
    }

    $('#join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.classList.add('spin');
      try {
        const sel = selNazwa.selectedOptions[0];
        const nazwaUcznia = sel && sel.value ? sel.dataset.nazwa : manual.value.trim();
        const uczenId = sel && sel.value ? sel.value : null;
        const out = await CQ.Gra.join($('#kod').value, {
          nazwa: nazwaUcznia, uczenId, kolor: color, nakrycie: hat,
          zespol: $('#teams') ? (document.querySelector('input[name=zespol]:checked') || {}).value || 0 : 0,
        });
        write({ gracz_id: out.gracz.id, sesja_id: out.sesja.id, kod: out.sesja.kod, nazwa: out.gracz.nazwa });
        me = read();
        CQ.Student.save({ uczen_id: uczenId || null, nazwa: out.gracz.nazwa, klasa_id: selKlasa.value || null });
        ui.toast(out.wznowiono ? 'Wracasz do gry — miło Cię widzieć z powrotem!' : 'Jesteś na liście. Trzymaj kciuki!', 'ok');
        render();
      } catch (err) {
        btn.classList.remove('spin');
        renderJoin(err.message);
      }
    });
    view.querySelectorAll('[data-trening]').forEach((n) => n.addEventListener('click', () => startTrening(n.dataset.trening)));
  }

  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* ============================ TRENING SOLO ============================ */
  function startTrening(zestawId) {
    const pytania = CQ.Zestawy.pytania(zestawId);
    if (!pytania.length) return ui.toast('Ten zestaw nie ma pytań.', 'warn');
    trening = { zestaw_id: zestawId, pytania, indeks: 0, dobre: 0, zle: 0, punkty: 0, odpowiedzi: {}, started: Date.now() };
    render(true);
  }

  function renderTrening() {
    const t = trening;
    const q = t.pytania[t.indeks];
    const done = t.indeks >= t.pytania.length;
    if (done) {
      const trafnosc = Math.round((t.dobre / t.pytania.length) * 100);
      view.innerHTML = `<div class="neu-card phase-card center card-enter">
        <div style="font-size:3rem">${trafnosc >= 80 ? '🏆' : trafnosc >= 50 ? '💪' : '📚'}</div>
        <h1>Trening skończony</h1>
        <p class="muted semi mt-8">Dobrze odpowiedziałeś na <b>${t.dobre}</b> z <b>${t.pytania.length}</b> pytań (${trafnosc}%).</p>
        <div class="score-strip mt-16">
          <div class="cell"><div class="v" style="color:var(--green)">${t.dobre}</div><div class="l">poprawnych</div></div>
          <div class="cell"><div class="v" style="color:var(--red)">${t.zle}</div><div class="l">błędów</div></div>
          <div class="cell"><div class="v">${Math.round((Date.now() - t.started) / 1000)}s</div><div class="l">czas</div></div>
        </div>
        <div class="row-8 mt-24" style="justify-content:center">
          <button class="neu-btn primary" id="again">↻ Jeszcze raz</button>
          <button class="neu-btn" id="back">Wybierz inny zestaw</button>
        </div></div>`;
      $('#again').onclick = () => startTrening(t.zestaw_id);
      $('#back').onclick = () => { trening = null; render(true); };
      if (trafnosc >= 80) ui.confetti(1800);
      return;
    }

    const answered = t.odpowiedzi[q.id];
    view.innerHTML = `<div class="neu-card phase-card card-enter">
      <div class="row-between"><span class="qtype-tag tiny bold muted">TRENING · ${t.indeks + 1}/${t.pytania.length}</span>
        <button class="neu-btn sm ghost" id="quit">Opuść</button></div>
      <h1 class="mt-8" style="font-size:1.5rem">${ui.esc(q.tresc)}</h1>
      <div class="answer-grid mt-16" data-opts></div>
      ${answered ? feedbackHtml(q, answered) : ''}
    </div>`;
    $('#quit').onclick = () => { trening = null; render(true); };
    paintOptions(q, answered ? { picked: answered.opcja, locked: true } : {}, (key, text) => {
      const good = CQ.Gra.sprawdz(q, key || text);
      t.odpowiedzi[q.id] = { opcja: key || text, good };
      good ? t.dobre++ : t.zle++;
      t.punkty += good ? 100 : 0;
      render(true);
    }, q.typ === 'otwarte');

    view.querySelectorAll('[data-next]').forEach((b) => b.onclick = () => { t.indeks++; render(true); });
  }

  function feedbackHtml(q, answered, extra) {
    const correctText = q.typ === 'otwarte'
      ? q.poprawna_odp.split(';')[0]
      : (q[{'A':'opcja_a','B':'opcja_b','C':'opcja_c','D':'opcja_d'}[q.poprawna_opcja]] || q.poprawna_opcja);
    return `<div class="feedback ${answered.good ? 'good' : 'bad'} mt-16">
      <div class="big">${answered.good ? '✅' : '❌'}</div>
      <b>${answered.good ? 'Brawo, dobrze!' : 'Nie tym razem'}</b>
      <p class="small muted mt-8">Poprawna odpowiedź: <b>${ui.esc(correctText)}</b></p>
      ${q.wytlumaczenie ? `<p class="small mt-8">💡 ${ui.esc(q.wytlumaczenie)}</p>` : ''}
      ${extra || ''}
      <button class="neu-btn primary mt-16" data-next>Dalej →</button>
    </div>`;
  }

  /* ============================ WIDOK: GRA ============================== */
  async function render(force) {
    const klucz = widokKlucz();
    if (!force && klucz === sig) return;
    sig = klucz;
    if (trening) { renderTrening(); return; }
    if (!me || !CQ.store.byId('gracze', me.gracz_id)) { renderJoin(); return; }
    const gracz = CQ.store.byId('gracze', me.gracz_id);
    const sesja = CQ.store.byId('sesje', gracz.sesja_id);
    if (!sesja) { localStorage.removeItem(LS_ME); me = null; return renderJoin('Ta sesja już nie istnieje.'); }

    $('#who').innerHTML = `<span class="badge blue" title="${ui.esc(gracz.nazwa)}">${ui.avatar(gracz.nazwa, gracz.kolor, gracz.nakrycie, 'sm')} ${ui.esc(gracz.nazwa)}</span>`;

    const qs = CQ.Gra.pytania(sesja);
    const q = CQ.Gra.aktualnePytanie(sesja);
    const moja = q ? CQ.Gra.odpowiedzGracza(sesja.id, gracz.id, q.id) : null;
    if (sesja.status === 'lobby') return renderLobby(sesja, qs, gracz);
    if (sesja.status === 'pytanie') return renderQuestion(sesja, q, gracz, moja);
    if (sesja.status === 'przerwa') return renderInfo(sesja, '⏸️', 'Przerwa', 'Nauczyciel zatrzymał grę. Chwila oddechu — zaraz wracamy.');
    if (sesja.status === 'podsumowanie') return renderPodsumowanie(sesja, q, gracz, moja);
    return renderKoniec(sesja, gracz);
  }

  function shell(sesja, inner, title) {
    const qs = CQ.Gra.pytania(sesja);
    view.innerHTML = `
      <div class="neu-card phase-card card-enter">
        <div class="row-between mb-16">
          <div class="row-8"><span class="badge blue">${ui.esc(sesja.kod)}</span>
            <span class="badge">${ui.esc(CQ.TRYBY[sesja.tryb].nazwa)}</span></div>
          <div class="row-8">${title || ''}<button class="neu-btn sm ghost" data-leave>Wyjdź</button></div>
        </div>
        ${sesja.status !== 'lobby' && sesja.status !== 'koniec' ? `<div class="q-progress mb-16" style="display:flex;gap:4px;flex-wrap:wrap">${qs.map((x, i) => `<i style="width:15px;height:6px;border-radius:3px;background:${i < sesja.indeks ? 'var(--green)' : i === sesja.indeks ? 'var(--blue)' : 'var(--bg-deep)'}"></i>`).join('')}</div>` : ''}
        ${inner}
      </div>
      <div id="extra"></div>`;
    view.querySelector('[data-leave]').addEventListener('click', async () => {
      const yes = await ui.confirmBox('Wyjść z gry?', 'Wrócisz na ekran dołączania. Wyniki dotychczasowych odpowiedzi zostaną zachowane.');
      if (!yes) return;
      await CQ.Gra.leave(graczId());
      localStorage.removeItem(LS_ME);
      me = null; render(true);
    });
  }
  const graczId = () => (me && me.gracz_id) || null;

  function renderLobby(sesja, qs, gracz) {
    const gracze = CQ.Gra.gracze(sesja.id);
    shell(sesja, `
      <div class="center stack stack-12">
        <div style="font-size:2.6rem">🎪</div>
        <h1 style="font-size:1.6rem">Jesteś na liście<span class="dots"></span></h1>
        <p class="muted small">Lekcja zaczyna się, gdy nauczyciel kliknie START. ${qs.length} pytań po ${sesja.limit_s} s.</p>
        <div class="lobby-list mt-8">${gracze.map((g) => `<div class="p" style="${g.id === gracz.id ? 'color:var(--blue)' : ''}">
          ${ui.avatar(g.nazwa, g.kolor, g.nakrycie)}<span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ui.esc(g.nazwa)}</span></div>`).join('')}</div>
      </div>`,
      `<span class="badge green live">${gracze.length} w lobby</span>`);
  }

  function renderQuestion(sesja, q, gracz, moja) {
    if (!q) return renderInfo(sesja, '⏳', 'Chwila cierpliwości', 'Nauczyciel właśnie przejmuje następne pytanie.');
    const stan = CQ.Gra.stanCzasu(sesja);
    const opts = q.typ === 'otwarte' ? [] : optionsFor(q);
    const seria = CQ.Gra.seria(sesja.id, gracz.id);

    shell(sesja, `
      <div class="row-between" style="align-items:flex-start">
        <div class="grow"><span class="qtype-tag tiny bold muted">${typLabel(q)} · ${q.punkty || 100} pkt</span>
          <h1 class="mt-8" style="font-size:1.35rem">${ui.esc(q.tresc)}</h1></div>
        <div id="ring-holder"></div>
      </div>
      ${seria.dobre >= 2 ? `<div class="streak mt-8">🔥 seria ${seria.dobre} poprawnych</div>` : ''}
      <div class="answer-grid mt-16" data-opts></div>
      ${moja ? `<div class="neu-card inset pad-sm mt-16 small center">
          ${moja.poprawna ? '<b style="color:var(--green)">Zapisane — i dobrze! ⚡</b>' : '<b class="muted">Odpowiedź zapisana. Czekamy na resztę klasy…</b>'}
          <div class="mt-8 row-8" style="justify-content:center"><button class="neu-btn sm" data-next-info>Statystyki</button></div>
        </div>` : `<p class="tiny muted center mt-16">Jedna odpowiedź na pytanie — potem blokada.</p>`}
    `);

    ring = ui.timerRing(stan.pozostalo);
    document.getElementById('ring-holder').appendChild(ring);
    if (ticker) clearInterval(ticker);
    ticker = setInterval(() => {
      const s = CQ.store.byId('sesje', sesja.id);
      if (!s || s.status !== 'pytanie') { clearInterval(ticker); return render(); }
      const st = CQ.Gra.stanCzasu(s);
      ring.setValue(st.pozostalo / (s.limit_s || 20), st.pozostalo);
    }, 200);

    paintOptions(q, { picked: moja ? moja.tresc : null, locked: !!moja }, async (key, text) => {
      try {
        await CQ.Gra.answer({ sesjaId: sesja.id, graczId: gracz.id, pytanieId: q.id, tresc: key || text });
        render(true);
      } catch (err) { ui.toast(err.message, 'warn', 2600); }
    }, q.typ === 'otwarte');

    view.querySelector('[data-next-info]')?.addEventListener('click', () => renderPodsumowanie(sesja, q, gracz, moja));
  }

  function renderInfo(sesja, emoji, title, sub) {
    shell(sesja, `<div class="center stack stack-8" style="padding:24px 0">
      <div style="font-size:2.6rem">${emoji}</div><h1 style="font-size:1.4rem">${title}</h1>
      <p class="muted small">${sub}</p></div>`);
  }

  function renderPodsumowanie(sesja, q, gracz, moja) {
    if (!q) return renderInfo(sesja, '⏳', 'Czekamy', 'Nauczyciel wybiera następne pytanie.');
    const stat = CQ.Gra.statystykiPytania(sesja.id, q.id);
    const wynik = CQ.Gra.wynik(sesja.id);
    const ja = wynik.rows.find((r) => r.id === gracz.id);
    shell(sesja, `
      <div class="qtype-tag tiny bold muted">Omówienie · pytanie ${sesja.indeks + 1}/${CQ.Gra.pytania(sesja).length}</div>
      <h2 class="mt-8" style="font-size:1.2rem">${ui.esc(q.tresc)}</h2>
      ${moja ? `<div class="feedback ${moja.poprawna ? 'good' : 'bad'} mt-16">
          <div class="big">${moja.poprawna ? '🎉' : '😬'}</div>
          <b>${moja.poprawna ? `Dobrze! +${ui.fmtPts(moja.punkty)} pkt` : 'Nie trafiłeś'}</b>
          ${moja.poprawna && moja.czas_ms ? `<div class="tiny muted">odpowiedź w ${(moja.czas_ms / 1000).toFixed(1)} s</div>` : ''}
        </div>`
        : `<div class="feedback bad mt-16"><div class="big">🕐</div><b>Brak odpowiedzi — czas minął.</b></div>`}
      ${q.wytlumaczenie ? `<p class="small muted mt-16">💡 ${ui.esc(q.wytlumaczenie)}</p>` : ''}
      <div class="row-between mt-16">
        <span class="badge ${stat.poprawnych / Math.max(1, stat.odp) > .6 ? 'green' : 'amber'}">${stat.poprawnych}/${stat.odp || 0} klasy odpowiedziało dobrze</span>
        <span class="tiny muted">Twoje miejsce: ${ja ? ja.miejsce : '—'} · dorobek: ${ja ? ui.fmtPts(ja.punkty) : 0} pkt</span>
      </div>
      <div class="mini-rank mt-16">${wynik.rows.slice(0, 6).map((r) => `
        <div class="row ${r.id === gracz.id ? 'me' : ''}"><b style="width:20px">${r.miejsce}</b>
          <span class="grow">${ui.esc(r.nazwa)}</span><span>${r.dobre}/${r.dobre + r.zle}</span><b>${ui.fmtPts(r.punkty)}</b></div>`).join('')}</div>
      <p class="tiny muted center mt-16">Następne pytanie pojawi się, gdy nauczyciel kliknie „dalej”.</p>`);
  }

  async function renderKoniec(sesja, gracz) {
    const wynik = CQ.Gra.wynik(sesja.id);
    const ja = wynik.rows.find((r) => r.id === gracz.id) || { punkty: 0, dobre: 0, zle: 0, miejsce: '—' };
    const uczen = ja.uczen_id ? CQ.store.byId('uczniowie', ja.uczen_id) : null;
    const xp = CQ.store.where('wpisy_xp', (w) => w.sesja_id === sesja.id && w.uczen_id === (uczen && uczen.id));
    const sumaXp = xp.reduce((a, b) => a + b.kwota, 0);
    shell(sesja, `
      <div class="center stack stack-8">
        <div style="font-size:3rem">${ja.miejsce === 1 ? '🥇' : ja.miejsce <= 3 ? '🎖️' : '🎯'}</div>
        <h1 style="font-size:1.7rem">Koniec gry!</h1>
        <p class="muted small">Zajmujesz <b>${ja.miejsce}</b>. miejsce na ${wynik.rows.length} ${wynik.rows.length === 1 ? 'osobę' : 'osób'}.</p>
      </div>
      <div class="score-strip mt-16">
        <div class="cell"><div class="v">${ui.fmtPts(ja.punkty)}</div><div class="l">punktów</div></div>
        <div class="cell"><div class="v" style="color:var(--green)">${ja.dobre}</div><div class="l">dobrych</div></div>
        <div class="cell"><div class="v" style="color:var(--red)">${ja.zle}</div><div class="l">błędów</div></div>
      </div>
      ${uczen ? `<div class="neu-card inset pad-sm mt-16 center">
        <div class="tiny muted bold" style="letter-spacing:.08em">TWOJE XP W DZIENNIKU KLASOWYM</div>
        <div class="big-number" style="color:var(--blue);font-size:2.2rem;font-weight:800">${ui.fmtPts(uczen.xp)} XP</div>
        <div class="tiny muted">+${sumaXp} XP za tę grę · ${ui.levelBadge(uczen.xp)}</div></div>` : ''}
      ${wynik.druzyny ? `<div class="mt-16 tiny muted center">Wynik drużyn: ${wynik.druzyny.map((t) => `${t.emoji} ${t.nazwa} ${ui.fmtPts(t.punkty)}`).join(' · ')}</div>` : ''}
      <div class="section-title mt-24" style="font-size:1rem">🏁 Klasyfikacja</div>
      <div class="mini-rank">${wynik.rows.slice(0, 12).map((r) => `
        <div class="row ${r.id === gracz.id ? 'me' : ''}"><b style="width:20px">${['🥇','🥈','🥉'][r.miejsce - 1] || r.miejsce}</b>
        <span class="grow">${ui.esc(r.nazwa)}</span><span class="tiny muted">${r.dobre}/${r.dobre + r.zle}</span><b>${ui.fmtPts(r.punkty)}</b></div>`).join('')}</div>
      <div class="neu-card flat pad-sm mt-24">
        <b class="small">📥 Zgłoś pracę do dodatkowego XP</b>
        <p class="tiny muted mt-8">Nauczyciel zatwierdzi w panelu — dostaniesz punkty do poziomu klasy.</p>
        <form id="req" class="mt-8 stack stack-8">
          <input class="neu-input" name="tytul" placeholder="np. zadanie domowe, kartkówka poprawiona" required maxlength="80">
          <div class="row-8"><input class="neu-input" name="opis" placeholder="Krótki opis (opcjonalnie)" maxlength="160">
          <input class="neu-input" name="xp" type="number" min="1" max="100" value="20" style="width:90px" title="Ile XP prosisz"></div>
          <button class="neu-btn primary sm block" type="submit">Wyślij zgłoszenie</button>
        </form>
      </div>
      <div class="row-8 mt-16" style="justify-content:center">
        <a class="neu-btn" href="uczen.html">Strefa ucznia</a>
        <button class="neu-btn ghost" id="leave-end">Zakończ na tym urządzeniu</button>
      </div>`);

    $('#req').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await CQ.Zgloszenia.create({
          nauczycielId: sesja.nauczyciel_id, uczenId: uczen ? uczen.id : null, sesjaId: sesja.id,
          tytul: f.get('tytul'), opis: f.get('opis'), xp: f.get('xp'),
        });
        e.target.reset();
        ui.toast('Wysłane do zatwierdzenia ✅', 'ok');
      } catch (err) { ui.toast(err.message, 'err'); }
    });
    $('#leave-end').addEventListener('click', () => { localStorage.removeItem(LS_ME); me = null; render(true); });
    if (ja.miejsce && ja.miejsce <= 3) ui.confetti(2200);
  }

  /* ============================ POMOCNICZE ============================== */
  function optionsFor(q) {
    const out = [{ k: 'A', text: q.opcja_a }, { k: 'B', text: q.opcja_b }];
    if (q.typ === 'abcd') { if (q.opcja_c) out.push({ k: 'C', text: q.opcja_c }); if (q.opcja_d) out.push({ k: 'D', text: q.opcja_d }); }
    return out;
  }
  function typLabel(q) { return { abcd: 'wybierz', pf: 'prawda / fałsz', otwarte: 'wpisz odpowiedź' }[q.typ]; }

  function paintOptions(q, state, onPick, isOpen) {
    const holder = view.querySelector("[data-opts]");
    if (!holder) return;
    if (isOpen) {
      const form = ui.el('form', { class: 'stack stack-8' });
      const input = ui.el('input', { class: 'neu-input', name: 'odp', placeholder: 'Wpisz odpowiedź…', maxlength: 120, autocomplete: 'off' });
      if (state.picked) { input.value = state.picked; input.disabled = true; }
      const btn = ui.el('button', { class: 'neu-btn primary block lg', type: 'submit', text: state.picked ? 'Odpowiedź zapisana ✅' : 'Wyślij odpowiedź' });
      if (state.locked) btn.disabled = true;
      form.append(input, btn);
      form.addEventListener('submit', (e) => { e.preventDefault(); if (state.locked) return; const v = input.value.trim(); if (!v) return input.focus(); onPick(null, v); });
      holder.appendChild(form);
      return;
    }
    optionsFor(q).forEach((o) => {
      const b = ui.el('button', { class: 'answer-btn opt', type: 'button', dataset: { opt: o.k } });
      b.innerHTML = `<span class="key">${o.k}</span><span class="grow">${ui.esc(o.text)}</span>`;
      if (state.picked === o.k) b.classList.add('picked');
      if (state.locked) { b.disabled = true; if (state.picked !== o.k) b.style.opacity = '.55'; }
      b.addEventListener('click', () => { if (state.locked) return; onPick(o.k, o.text); });
      holder.appendChild(b);
    });
  }

  // klawisze 1-4 / A-D w grze
  document.addEventListener('keydown', (e) => {
    const sesja = me && CQ.store.byId('sesje', (CQ.store.byId('gracze', me.gracz_id) || {}).sesja_id);
    if (!sesja || sesja.status !== 'pytanie' || trening) return;
    const q = CQ.Gra.aktualnePytanie(sesja);
    if (!q || q.typ === 'otwarte') return;
    const gracz = CQ.store.byId('gracze', me.gracz_id);
    if (CQ.Gra.odpowiedzGracza(sesja.id, gracz.id, q.id)) return;
    const map = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', a: 'A', b: 'B', c: 'C', d: 'D' };
    const key = map[e.key.toLowerCase()];
    if (!key) return;
    const opt = optionsFor(q).find((o) => o.k === key);
    if (!opt) return;
    e.preventDefault();
    CQ.Gra.answer({ sesjaId: sesja.id, graczId: gracz.id, pytanieId: q.id, tresc: key })
      .then(() => render(true)).catch((err) => ui.toast(err.message, 'warn'));
  });

  /* Wejście prosto w trening solo — link z banku pytań („Podgląd”) i ze
     strefy ucznia („Trening”). Bez tego ?trening= prowadziło na ekran kodu. */
  if (paramTrening) {
    if (CQ.Zestawy.pytania(paramTrening).length) startTrening(paramTrening);
    else ui.toast('Ten zestaw nie ma pytań, więc trening nie ruszył.', 'warn');
  }

  ui.live(() => render(), { every: 1000 });
  render();
</script>
</body>
</html>
