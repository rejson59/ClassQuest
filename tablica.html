<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica — ClassQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { overflow-x: hidden; }
    .board-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .board-top .brand { font-size: 1.4rem; }
    .side-list { width: min(340px, 34vw); max-height: 74vh; overflow-y: auto; padding-right: 4px; }
    .side-list .rank-row { padding: 8px 13px; margin-bottom: 7px; font-size: .9rem; }
    .board-body { display: flex; gap: 30px; align-items: stretch; }
    .board-body .main { flex: 1; min-width: 0; }
    .join-url { font-size: clamp(1.1rem, 2.2vw, 1.7rem); font-weight: 800; letter-spacing: .04em; }
    .hint-bar { text-align: center; color: var(--text-muted); font-weight: 700; font-size: .85rem; padding-top: 8px; }
    .answer-pulse { animation: pop .35s var(--ease-bounce); }
    .big-number { font-size: clamp(2rem, 6vw, 4.4rem); font-weight: 800; line-height: 1; }
    .team-card { text-align: center; padding: 18px; border-radius: 22px; box-shadow: 8px 8px 18px var(--shadow-dark-soft), -8px -8px 18px var(--shadow-light); }
    .team-card .score { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .waiting-dots::after { content: ''; animation: dots 1.6s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    .reveal-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 26px; align-items: start; }
    @media (max-width: 980px) { .reveal-grid, .board-body { grid-template-columns: 1fr; display: grid; } .side-list { width: auto; max-height: 260px; } }
    @media (max-width: 700px) { .podium-grid { grid-template-columns: 1fr 1fr; } }
    .podium-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  </style>
</head>
<body>
<div class="board" id="board"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script type="module">
  const { ui } = CQ;
  const board = document.getElementById('board');
  await CQ.store.ready();

  const LS_LAST = 'cq_tablica_sesja';
  let sesjaId = new URLSearchParams(location.search).get('sesja') || localStorage.getItem(LS_LAST) || null;

  function findSesja() {
    if (sesjaId && CQ.store.byId('sesje', sesjaId)) return CQ.store.byId('sesje', sesjaId);
    const open = CQ.store.table('sesje').filter((s) => s.status !== 'koniec')
      .sort((a, b) => String(b.utworzono).localeCompare(String(a.utworzono)));
    return open[0] || CQ.store.table('sesje').sort((a, b) => String(b.utworzono).localeCompare(String(a.utworzono)))[0] || null;
  }

  let ring = null, tickHandle = null, lastPhase = null;

  function render() {
    const sesja = findSesja();
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    if (!sesja) { board.innerHTML = emptyBoard(); return; }
    sesjaId = sesja.id;
    localStorage.setItem(LS_LAST, sesja.id);

    const qs = CQ.Gra.pytania(sesja);
    const gracze = CQ.Gra.gracze(sesja.id);
    const wynik = CQ.Gra.wynik(sesja.id);
    const q = CQ.Gra.aktualnePytanie(sesja);
    const klasa = CQ.store.byId('klasy', sesja.klasa_id);
    const zestaw = CQ.store.byId('zestawy', sesja.zestaw_id);

    board.innerHTML = `
      <div class="board-top">
        <a class="brand" href="index.html"><span class="brand-mark">🎲</span><span>ClassQuest<small>tryb tablicy</small></span></a>
        <div class="row-12 wrap">
          <span class="badge blue">${ui.esc(klasa ? klasa.nazwa : 'klasa?')}</span>
          <span class="badge">${ui.esc(zestaw ? zestaw.nazwa_zestawu : '')}</span>
          <span class="badge green live">${gracze.length} ${grammatyka(gracze.length)}</span>
          ${ui.statusBadge(sesja.status)}
          <a class="neu-btn sm" href="nauczyciel.html">🎛️ Panel</a>
          <button class="neu-btn sm" data-fullscreen>⛶全屏</button>
        </div>
      </div>
      <div class="board-main" id="main"></div>
      <div class="hint-bar">
        <b>Uczniowie:</b> wejdź na <span class="join-url">${escUrl()}</span> i wpisz kod
        <span style="color:var(--blue);font-weight:800">${sesja.kod}</span>
        &nbsp;·&nbsp; skróty: <kbd>N</kbd> następne · <kbd>R</kbd> wynik · <kbd>Spacja</kbd> start · <kbd>F</kbd> pełny ekran
      </div>`;

    const main = document.getElementById('main');

    if (sesja.status === 'lobby') renderLobby(main, sesja, gracze, qs, wynik);
    else if (sesja.status === 'pytanie') renderQuestion(main, sesja, q, gracze, qs, wynik);
    else if (sesja.status === 'przerwa') renderPaused(main, sesja, q, wynik);
    else if (sesja.status === 'podsumowanie') renderReveal(main, sesja, q, gracze, qs, wynik);
    else renderFinal(main, sesja, wynik, qs, gracze);

    board.querySelector('[data-fullscreen]').addEventListener('click', toggleFullscreen);
  }

  function grammatyka(n) { return n === 1 ? 'gracz' : (n >= 2 && n <= 4 ? 'graczy' : 'graczy'); }
  function escUrl() { return ui.esc(location.origin + location.pathname.replace('tablica.html', 'gra.html')); }

  function emptyBoard() {
    return `<div class="board-main center-xy stack stack-16" style="text-align:center">
      <div style="font-size:3rem">📽️</div>
      <h1>Tablica gotowa</h1>
      <p class="muted semi">Nie ma aktywnej gry. Uruchom ją w panelu nauczyciela — tutaj pojawi się kod pokoju i pytania.</p>
      <div class="row-8"><a class="neu-btn primary" href="nauczyciel.html">Przejdź do panelu</a>
      <a class="neu-btn" href="pomoc.html">Instrukcja</a></div>
    </div>`;
  }

  /* ---- fazy ------------------------------------------------------------- */

  function renderLobby(main, sesja, gracze, qs, wynik) {
    main.innerHTML = `
      <div class="center stack stack-16">
        <div class="qtype-tag">Kod do gry</div>
        <div class="code-hero" id="hero-code">${[...sesja.kod].map((d, i) => `<span style="animation-delay:${i * 0.08}s">${d}</span>`).join('')}</div>
        <p class="muted semi">Wejdźcie na <b>${escUrl()}</b> i wpiszcie kod. START za chwilę — ${qs.length} pytań, ${sesja.limit_s} s na każde.</p>
      </div>
      <div class="board-body">
        <div class="main neu-card" style="min-height:220px">
          <div class="section-title">👥 Na liście <span class="spacer"></span><span class="tiny muted waiting-dots">czekam na resztę klasy</span></div>
          ${gracze.length ? `<div class="players" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
            ${gracze.map((g) => `<div class="player">
              ${ui.avatar(g.nazwa, g.kolor, g.nakrycie, 'bounce')}
              <b>${ui.esc(g.nazwa)}</b></div>`).join('')}</div>`
            : ui.empty('🎈', 'Nikt jeszcze nie dołączył', 'Podyktuj kod klasie albo wyślij link.') }
        </div>
      </div>`;
  }

  function renderQuestion(main, sesja, q, gracze, qs, wynik) {
    const stan = CQ.Gra.stanCzasu(sesja);
    const answered = CQ.Gra.statystykiPytania(sesja.id, q.id).odp;
    const opts = q.typ === 'otwarte' ? [] : optionsFor(q);
    main.innerHTML = `
      <div class="row-between" style="align-items:flex-start">
        <div>
          <div class="qtype-tag">${typLabel(q)} · pytanie ${sesja.indeks + 1}/${qs.length} · ${q.punkty || 100} pkt</div>
          <h1 class="qtext mt-8">${ui.esc(q.tresc)}</h1>
        </div>
        <div id="ring-holder" style="display:flex;justify-content:flex-end"></div>
      </div>
      ${q.typ === 'otwarte'
        ? `<div class="neu-card inset" style="padding:30px;text-align:center">
             <div style="font-size:2.2rem">✍️</div>
             <b>Odpowiedź otwarta — uczniowie wpisują ją na swoich urządzeniach.</b>
             <p class="muted small mt-8">Na tablicy nie pokazamy odpowiedzi, żeby nikogo nie sugerować.</p></div>`
        : `<div class="answer-grid">${opts.map((o) => `
            <div class="answer-btn" data-opt="${o.k}" style="cursor:default">
              <span class="key">${o.k}</span><span class="grow">${ui.esc(o.text)}</span>
              <span class="fx" data-count="${o.k}"></span>
            </div>`).join('')}</div>`}
      <div class="row-between mt-16">
        <span class="badge ${answered >= gracze.length && gracze.length ? 'green' : 'amber'}">${answered}/${gracze.length} odpowiedziało</span>
        <span class="tiny muted">Punkty: baza za poprawną + bonus za czas + premia za serię</span>
      </div>`;

    ring = ui.timerRing(stan.pozostalo, { big: true });
    document.getElementById('ring-holder').appendChild(ring);
    tickHandle = setInterval(() => {
      const s = CQ.store.byId('sesje', sesja.id);
      if (!s || s.status !== 'pytanie') return render();
      const st = CQ.Gra.stanCzasu(s);
      ring.setValue(st.pozostalo / (s.limit_s || 20), st.pozostalo);
      const stat = CQ.Gra.statystykiPytania(s.id, q.id);
      const badgeEl = main.querySelector('.badge');
      if (badgeEl) badgeEl.textContent = `${stat.odp}/${gracze.length} odpowiedziało`;
      opts.forEach((o) => {
        const n = stat.rozklad[o.k] || 0;
        const eli = main.querySelector(`[data-count="${o.k}"]`);
        if (eli && n) { eli.textContent = n; eli.classList.add('answer-pulse'); }
      });
    }, 250);
  }

  function renderPaused(main, sesja, q, wynik) {
    main.innerHTML = `<div class="center stack stack-16 center-xy" style="min-height:50vh">
      <div style="font-size:3rem">⏸️</div>
      <h1>Przerwa w grze</h1>
      <p class="muted semi">Nauczyciel zatrzymał czas. Odpowiedzi wrócą po wznowieniu.</p></div>`;
  }

  function renderReveal(main, sesja, q, gracze, qs, wynik) {
    const stat = CQ.Gra.statystykiPytania(sesja.id, q.id);
    const opts = q.typ === 'otwarte' ? [] : optionsFor(q);
    const total = Math.max(1, stat.odp);
    main.innerHTML = `
      <div class="qtype-tag">${typLabel(q)} · poprawna odpowiedź</div>
      <h1 class="qtext mt-8">${ui.esc(q.tresc)}</h1>
      <div class="reveal-grid mt-16">
        <div>
          ${q.typ === 'otwarte'
            ? `<div class="neu-card inset pad-sm" style="font-size:1.2rem;font-weight:800">✅ ${ui.esc(q.poprawna_odp.split(';')[0])}</div>`
            : `<div class="answer-grid">${opts.map((o) => {
                const n = stat.rozklad[o.k] || 0;
                const good = o.k === q.poprawna_opcja;
                return `<div class="answer-btn ${good ? 'correct' : n ? '' : ''}" style="cursor:default">
                  <span class="key">${o.k}</span><span class="grow">${ui.esc(o.text)}</span>
                  <span class="fx">${n ? Math.round((n / total) * 100) + '%' : ''}<small>${n} ${grammatyka2(n)}</small></span></div>`;
              }).join('')}</div>`}
          ${q.wytlumaczenie ? `<div class="neu-card flat pad-sm mt-16"><b class="small">💡 Dlaczego tak</b><p class="small muted mt-8">${ui.esc(q.wytlumaczenie)}</p></div>` : ''}
        </div>
        <div class="neu-card">
          <div class="section-title">📊 Jak poszło</div>
          <div class="grid-2" style="gap:12px">
            <div class="stat"><div class="label">Poprawnych</div><div class="value">${stat.poprawnych}/${stat.odp || 0}</div>
              <div class="progress ${stat.poprawnych / total > 0.6 ? 'green' : 'amber'}" style="margin-top:8px"><i style="width:${Math.round(stat.poprawnych / total * 100)}%"></i></div></div>
            <div class="stat"><div class="label">Średni czas</div><div class="value">${(stat.sredniCzas / 1000).toFixed(1)}s</div><div class="hint">${stat.frekwencja}% klasy odpowiedziało</div></div>
          </div>
          ${stat.najszybszy ? `<div class="mt-16 small semi">⚡ Najszybszy: <b>${ui.esc((CQ.store.byId('gracze', stat.najszybszy.gracz_id) || {}).nazwa || '?')}</b> — ${(stat.najszybszy.czas_ms / 1000).toFixed(1)} s</div>` : ''}
          ${q.typ === 'otwarte' ? `<div class="mt-16 tiny muted">Odpowiedzi uczniów: ${ui.esc(odpisyOtwarte(sesja.id, q.id))}</div>` : ''}
        </div>
      </div>`;
  }

  function renderFinal(main, sesja, wynik, qs, gracze) {
    const teams = wynik.druzyny;
    main.innerHTML = `
      <div class="center stack stack-12">
        <div class="qtype-tag">Koniec gry</div>
        <h1 style="font-size:clamp(1.8rem,4vw,3rem)">🏁 ${ui.esc((CQ.store.byId('zestawy', sesja.zestaw_id) || {}).nazwa_zestawu || '')}</h1>
        <p class="muted semi">${gracze.length} ${grammatyka(gracze.length)} · ${qs.length} pytań · XP już dopisane do dziennika</p>
      </div>
      ${teams ? `<div class="podium-grid" id="teams">${teams.map((t, i) => `
          <div class="team-card" style="border-bottom:6px solid ${t.kolor}">
            <div style="font-size:1.6rem">${t.emoji}</div>
            <b>${t.nazwa}</b>
            <div class="score" style="color:${t.kolor}">${ui.fmtPts(t.punkty)}</div>
            <small class="muted">${i === 0 ? '🥇 zwycięzcy' : `${t.licznik} w drużynie`}</small>
          </div>`).join('')}</div>` : ''}
      <div class="podium" style="margin-top:10px">
        ${wynik.rows.slice(0, 3).map((r, i) => `
          <div class="place p${i + 1}">
            <div class="medal">${['🥇', '🥈', '🥉'][i]}</div>
            <div class="center">${ui.avatar(r.nazwa, r.kolor, r.nakrycie, 'bounce')}</div>
            <div class="name">${ui.esc(r.nazwa)}</div>
            <div class="pts">${ui.fmtPts(r.punkty)} pkt · ${r.dobre}/${r.dobre + r.zle}</div>
          </div>`).join('')}
      </div>
      ${wynik.rows.length > 3 ? `<div class="mt-16" style="max-height:30vh;overflow:auto">${wynik.rows.slice(3, 20).map((r) => `
        <div class="rank-row"><span class="pos">${r.miejsce}</span><span class="grow semi">${ui.esc(r.nazwa)}</span>
        <span class="muted small">${r.dobre}/${r.dobre + r.zle}</span><span class="pts">${ui.fmtPts(r.punkty)}</span></div>`).join('')}</div>` : ''}
      <div class="center row-8 mt-16" style="justify-content:center">
        <a class="neu-btn primary" href="nauczyciel.html">Panel nauczyciela</a>
        <a class="neu-btn" href="wyniki.html?sesja=${sesja.id}">Pełny raport</a>
        <button class="neu-btn" data-again>↻ Zagraj jeszcze raz tymi samymi pytaniami</button>
      </div>`;
    ui.confetti(3200);
    main.querySelector('[data-again]').addEventListener('click', async () => {
      const nowa = await CQ.Gra.createSession({ nauczycielId: sesja.nauczyciel_id, klasaId: sesja.klasa_id, zestawId: sesja.zestaw_id, tryb: sesja.tryb, limitS: sesja.limit_s });
      localStorage.setItem('cq_aktywna_sesja', nowa.id);
      sesjaId = nowa.id;
      ui.toast('Nowa gra w lobby: kod ' + nowa.kod, 'ok');
      render();
    });
  }

  /* ---- pomocnicze -------------------------------------------------------- */

  function optionsFor(q) {
    const out = [{ k: 'A', text: q.opcja_a }, { k: 'B', text: q.opcja_b }];
    if (q.typ === 'abcd') { if (q.opcja_c) out.push({ k: 'C', text: q.opcja_c }); if (q.opcja_d) out.push({ k: 'D', text: q.opcja_d }); }
    return out;
  }
  function typLabel(q) { return { abcd: 'Wybierz odpowiedź', pf: 'Prawda / Fałsz', otwarte: 'Odpowiedź otwarta' }[q.typ] || 'Pytanie'; }
  function grammatyka2(n) { return n === 1 ? 'osoba' : 'osoby'; }
  function odpisyOtwarte(sesjaId, pytanieId) {
    const o = CQ.Gra.odpowiedzi(sesjaId).filter((x) => x.pytanie_id === pytanieId).slice(0, 6);
    return o.length ? o.map((x) => `„${x.tresc}”`).join(', ') : 'brak odpowiedzi';
  }
  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => ui.toast('Pełny ekran zablokowany przez przeglądarkę.', 'warn'));
    else document.exitFullscreen?.();
  }

  document.addEventListener('keydown', (e) => {
    const sesja = findSesja();
    if (!sesja || e.target.matches('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'f') { e.preventDefault(); return toggleFullscreen(); }
    if (sesja.status === 'lobby' && (k === ' ' || k === 'enter')) { e.preventDefault(); CQ.Gra.start(sesja.id); }
    else if (k === 'r') { e.preventDefault(); CQ.Gra.reveal(sesja.id); }
    else if (k === 'n') { e.preventDefault(); CQ.Gra.next(sesja.id); }
    else render();
  });

  ui.live(render);
  render();
</script>
</body>
</html>
