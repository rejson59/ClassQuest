<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e2e8f0;
      --card-bg: #edf2f7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Kolory przycisków */
      --btn-face: #ffffff;
      --btn-side: #cbd5e1;
      --btn-dark-shadow: rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Główna karta z mocnym, wyrazistym cieniem */
    .main-card {
      background: var(--card-bg);
      border-radius: 36px;
      padding: 50px 38px;
      width: 100%;
      max-width: 410px;
      text-align: center;
      box-shadow: 
        0px 20px 35px -5px rgba(15, 23, 42, 0.2),
        0px 10px 15px -5px rgba(15, 23, 42, 0.1);
      border: 2px solid #ffffff;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1.2px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 40px;
    }

    .title-question {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 28px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Prawdziwy przycisk 3D (Klocek) */
    .btn-3d {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 28px;
      border-radius: 22px;
      background: var(--btn-face);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2px solid #94a3b8;
      
      /* Górny rant jasny, dolny gruba krawędź 3D + mocny ciemny cień pod klockiem */
      box-shadow: 
        0px 8px 0px 0px #94a3b8,
        0px 16px 20px 0px var(--btn-dark-shadow);

      /* Przesunięcie w górę, żeby zrobić miejsce na "grubość" klocka */
      transform: translateY(-4px);
      transition: all 0.12s ease;
      cursor: pointer;
      user-select: none;
    }

    .btn-3d:hover {
      background: #ffffff;
      border-color: #64748b;
      /* Podbicie grubości na hover */
      box-shadow: 
        0px 10px 0px 0px #64748b,
        0px 20px 25px 0px rgba(15, 23, 42, 0.3);
      transform: translateY(-6px);
    }

    /* Fizyczne wciśnięcie klocka po kliknięciu */
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 
        0px 0px 0px 0px #64748b,
        0px 4px 8px 0px rgba(15, 23, 42, 0.25);
    }

    .icon {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="btn-3d">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="btn-3d">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
