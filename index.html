<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e0e5ec;
      --text-dark: #2d3748;
      --text-muted: #718096;
      /* Neumorphism Shadows */
      --shadow-flat: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
      --shadow-hover: 12px 12px 20px #a3b1c6, -12px -12px 20px #ffffff;
      --shadow-pressed: inset 6px 6px 10px #a3b1c6, inset -6px -6px 10px #ffffff;
      /* Accents */
      --purple: #6c5ce7;
      --cyan: #00cec9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Szklana karta z Neumorficznym cieniem */
    .glass-card {
      background: rgba(224, 229, 236, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      padding: 45px 35px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--shadow-flat);
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 35px;
    }

    .title-question {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 25px;
      color: var(--text-dark);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Realistyczne, wypukłe przyciski Neumorficzne */
    .neu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 24px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: none;
      box-shadow: var(--shadow-flat);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }

    .neu-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* Efekt wciskania fizycznego przycisku */
    .neu-btn:active {
      transform: translateY(1px);
      box-shadow: var(--shadow-pressed);
    }

    .neu-btn.teacher {
      border-bottom: 3px solid var(--purple);
    }

    .neu-btn.student {
      border-bottom: 3px solid var(--cyan);
    }

    .icon {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="neu-btn teacher">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="neu-btn student">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
