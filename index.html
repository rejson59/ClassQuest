<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e2e8f0;
      --card-glass: rgba(235, 240, 248, 0.7);
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Kolory przycisków i czarny krawędziak */
      --btn-bg: #ffffff;
      --btn-stroke: #0f172a;
      --shadow-drop: rgba(15, 23, 42, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #f1f5f9 0%, #cbd5e1 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Glassmorphism + Neumorfizm na karcie */
    .glass-card {
      background: var(--card-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 36px;
      padding: 50px 38px;
      width: 100%;
      max-width: 410px;
      text-align: center;
      box-shadow: 
        16px 16px 32px rgba(148, 163, 184, 0.5),
        -16px -16px 32px rgba(255, 255, 255, 0.9);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1.2px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 40px;
    }

    .title-question {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 28px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Przycisk z głębokim czarnym rantem 3D */
    .btn-3d {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 28px;
      border-radius: 20px;
      background: var(--btn-bg);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2.5px solid var(--btn-stroke);
      
      /* Czarny bok przycisku (6px) + delikatny miękki cień poniżej */
      box-shadow: 
        0px 6px 0px 0px var(--btn-stroke),
        0px 12px 18px 0px var(--shadow-drop);

      transform: translateY(-2px);
      transition: all 0.1s ease;
      cursor: pointer;
      user-select: none;
    }

    .btn-3d:hover {
      background: #ffffff;
      transform: translateY(-4px);
      box-shadow: 
        0px 8px 0px 0px var(--btn-stroke),
        0px 16px 22px 0px var(--shadow-drop);
    }

    /* Fizyczne zapadanie przy kliknięciu */
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 
        0px 0px 0px 0px var(--btn-stroke),
        0px 2px 6px 0px var(--shadow-drop);
    }

    .icon {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="btn-3d">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="btn-3d">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
