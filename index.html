<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Dokładny chłodny odcień jasnego szarego ze wzoru */
      --bg: #e6ecf5;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent: #2563eb;

      /* Precyzyjnie dobrane światło i cień pod kątem 135deg */
      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Główna wypukła karta */
    .neu-card {
      background: linear-gradient(145deg, #f0f6ff, #e0e7f1);
      border-radius: 36px;
      padding: 52px 42px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      
      /* Głębszy cień dla całej karty */
      box-shadow: 
        20px 20px 40px var(--shadow-dark),
        -20px -20px 40px var(--shadow-light);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .title-question {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 28px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Przycisk o wyraźnej wypukłości (dokładnie jak na Dribbble) */
    .neu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 26px;
      border-radius: 24px;
      
      /* Gradient sprawia, że przycisk nie jest płaski! */
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      
      /* Ostre, wyraziste cienie 3D */
      box-shadow: 
        7px 7px 14px var(--shadow-dark),
        -7px -7px 14px var(--shadow-light),
        inset 1px 1px 1px #ffffff;

      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      cursor: pointer;
      user-select: none;
    }

    .neu-btn:hover {
      color: var(--accent);
      /* Lekkie podniesienie i wyostrzenie cienia */
      box-shadow: 
        9px 9px 18px var(--shadow-dark),
        -9px -9px 18px var(--shadow-light),
        inset 1px 1px 2px #ffffff;
      transform: translateY(-2px);
    }

    /* Wciśnięcie do środka (Inverted Neumorphism) */
    .neu-btn:active {
      transform: translateY(1px);
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light);
    }

    .icon {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="neu-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="neu-btn">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="neu-btn">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
