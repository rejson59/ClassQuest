<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;

      /* Głębszy, realistyczny Neumorfizm z fizycznym uniesieniem */
      --shadow-lift: 
        14px 14px 28px rgba(166, 175, 195, 0.75),
        -14px -14px 28px rgba(255, 255, 255, 0.95);
        
      --shadow-hover: 
        20px 20px 36px rgba(150, 160, 182, 0.85),
        -20px -20px 36px rgba(255, 255, 255, 1);

      --shadow-pressed: 
        inset 8px 8px 16px rgba(166, 175, 195, 0.8),
        inset -8px -8px 16px rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Karta z delikatnym matem i wyrazistą ramką */
    .glass-card {
      background: rgba(226, 232, 240, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 36px;
      padding: 50px 40px;
      width: 100%;
      max-width: 410px;
      text-align: center;
      box-shadow: var(--shadow-lift);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1.2px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .title-question {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 28px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Fizyczne, unoszące się przyciski */
    .neu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 28px;
      border-radius: 24px;
      background: var(--bg);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.08rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow-lift);
      transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      user-select: none;
    }

    /* Reakcja na światło i zawieszenie w powietrzu przy najechaniu */
    .neu-btn:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* Fizyczna wklęsłość po kliknięciu */
    .neu-btn:active {
      transform: translateY(2px);
      box-shadow: var(--shadow-pressed);
      border-color: transparent;
    }

    .icon {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="neu-btn">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="neu-btn">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
