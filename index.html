<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Wybierz profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e5ebf1;
      --card-bg: #e8eef5;
      --text-main: #1e293b;
      --text-muted: #64748b;

      /* Ostre, wyraziste cienie bez białej chmury */
      --card-shadow: 
        0px 20px 30px -10px rgba(100, 115, 135, 0.25),
        0px 8px 12px -6px rgba(100, 115, 135, 0.15);

      --btn-shadow: 
        0px 10px 15px -4px rgba(100, 115, 135, 0.2),
        0px 4px 6px -2px rgba(100, 115, 135, 0.1);

      --btn-shadow-hover: 
        0px 18px 25px -5px rgba(100, 115, 135, 0.28),
        0px 8px 10px -4px rgba(100, 115, 135, 0.15);

      --btn-shadow-pressed: 
        inset 0px 4px 8px rgba(100, 115, 135, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      padding: 48px 36px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -1.2px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 36px;
    }

    .title-question {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .neu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 24px;
      border-radius: 20px;
      background: #f0f4f9;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease-in-out;
      cursor: pointer;
      user-select: none;
    }

    .neu-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--btn-shadow-hover);
      background: #ffffff;
    }

    .neu-btn:active {
      transform: translateY(1px);
      box-shadow: var(--btn-shadow-pressed);
      background: #e2e8f0;
      border-color: transparent;
    }

    .icon {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="logo">ClassQuest</div>
    <p class="subtitle">Interaktywna platforma lekcyjna</p>
    
    <h2 class="title-question">Kim jesteś?</h2>

    <div class="btn-group">
      <a href="nauczyciel.html" class="neu-btn">
        <span class="icon">🎓</span>
        <span>Nauczyciel</span>
      </a>

      <a href="uczen.html" class="neu-btn">
        <span class="icon">🎮</span>
        <span>Uczeń</span>
      </a>
    </div>
  </div>

</body>
</html>
