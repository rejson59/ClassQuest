<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassQuest - Dashboard Nauczyciela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #e6ecf5;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent: #2563eb;
      --accent-green: #10b981;

      --shadow-dark: rgba(166, 180, 200, 0.7);
      --shadow-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Karta bazowa */
    .neu-card {
      background: linear-gradient(145deg, #f0f6ff, #e0e7f1);
      border-radius: 28px;
      padding: 26px;
      
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light);

      opacity: 0;
      transform: translate(-15px, -15px) scale(0.96);
      animation: cardAppear 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    /* TOPBAR / MENU GÓRNE */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      animation-delay: 0.1s;
      position: relative;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .user-menu-wrapper {
      position: relative;
    }

    /* Przycisk profilu wyzwalający menu */
    .profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 
        5px 5px 10px var(--shadow-dark),
        -5px -5px 10px var(--shadow-light);
      transition: all 0.2s ease;
    }

    .profile-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        7px 7px 14px var(--shadow-dark),
        -7px -7px 14px var(--shadow-light);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .user-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    /* Płynnie rozwijane menu (Dropdown) */
    .dropdown-menu {
      position: absolute;
      top: 120%;
      right: 0;
      width: 200px;
      background: linear-gradient(145deg, #f0f6ff, #e0e7f1);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 
        10px 10px 20px var(--shadow-dark),
        -10px -10px 20px var(--shadow-light);
      
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(0.95);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dropdown-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .dropdown-item:hover {
      background: rgba(37, 99, 235, 0.08);
      color: var(--accent);
    }

    /* SIATKA 3-KOLUMNOWA */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .col-1 { animation-delay: 0.2s; }
    .col-2 { animation-delay: 0.32s; }
    .col-3 { animation-delay: 0.44s; }

    /* LEKCJE DÓŁ (2 KOLUMNY) */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .row-2-left { animation-delay: 0.56s; }
    .row-2-right { animation-delay: 0.68s; }

    @media (max-width: 900px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    /* Wklęsły Input */
    .neu-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: none;
      outline: none;
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 14px;

      box-shadow: 
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);

      transition: box-shadow 0.2s ease;
    }

    .neu-input::placeholder { color: var(--text-muted); font-weight: 600; }
    .neu-input:focus {
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light),
        0 0 0 2px var(--accent);
    }

    /* Przycisk rozwinięcia */
    .neu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 18px;
      
      background: linear-gradient(145deg, #ffffff, #dbe2ed);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      
      box-shadow: 
        6px 6px 12px var(--shadow-dark),
        -6px -6px 12px var(--shadow-light),
        inset 1px 1px 1px #ffffff;

      opacity: 0;
      transform: scaleX(0.5) translateY(12px);
      transform-origin: center;
      animation: btnExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.15s ease, color 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .btn-delay-1 { animation-delay: 0.4s; }
    .btn-delay-2 { animation-delay: 0.5s; }

    @keyframes btnExpand {
      to {
        opacity: 1;
        transform: scaleX(1) translateY(0);
      }
    }

    .neu-btn:hover {
      color: var(--accent);
      box-shadow: 
        8px 8px 16px var(--shadow-dark),
        -8px -8px 16px var(--shadow-light);
      transform: scaleX(1) translateY(-2px);
    }

    .neu-btn:active {
      transform: scaleX(1) translateY(1px);
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      box-shadow: 
        inset 5px 5px 10px var(--shadow-dark),
        inset -5px -5px 10px var(--shadow-light);
    }

    /* Kafelki statystyk wstrzyknięte w wklęsły box */
    .stat-box {
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(145deg, #dbe2ed, #ffffff);
      text-align: center;
      margin-bottom: 10px;
      box-shadow: 
        inset 3px 3px 6px var(--shadow-dark),
        inset -3px -3px 6px var(--shadow-light);
    }

    .stat-num { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .stat-text { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }

    /* Podskakujące litery */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      animation: letterJump 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes letterJump {
      0% { opacity: 0; transform: translateY(14px); }
      60% { transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- TOPBAR / NAGŁÓWEK NA KAŻDEJ PODSTRONIE -->
    <div class="neu-card topbar">
      <div class="brand">
        <span style="font-size: 1.4rem;">🎓</span>
        <span class="logo-text" id="logoText">ClassQuest</span>
      </div>

      <div class="user-menu-wrapper">
        <button class="profile-btn" id="profileBtn">
          <div class="avatar">N</div>
          <span class="user-name">Prof. Kowalski</span>
          <span style="font-size: 0.7rem;">▼</span>
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="#" class="dropdown-item">⚙️ Ustawienia</a>
          <a href="#" class="dropdown-item">📊 Raporty</a>
          <a href="index.html" class="dropdown-item" style="color: #ef4444;">🚪 Wyloguj</a>
        </div>
      </div>
    </div>

    <!-- SIATKA 3 KOLUMN W JEDNEJ LINII -->
    <div class="grid-3">
      
      <!-- KOLUMNA 1: SZYBKI START -->
      <div class="neu-card col-1">
        <div class="card-title">🚀 Szybka Lekcja</div>
        <input type="text" class="neu-input" placeholder="Wpisz temat lekcji..." />
        <button class="neu-btn btn-delay-1" style="color: var(--accent);">Rozpocznij teraz</button>
      </div>

      <!-- KOLUMNA 2: STATYSTYKA -->
      <div class="neu-card col-2">
        <div class="card-title">📊 Dziś w klasach</div>
        <div class="stat-box">
          <div class="stat-num">28</div>
          <div class="stat-text">Uczniów online</div>
        </div>
      </div>

      <!-- KOLUMNA 3: SZYBKIE AKCJE -->
      <div class="neu-card col-3">
        <div class="card-title">⚡ Akcje</div>
        <button class="neu-btn btn-delay-2" style="margin-bottom: 10px;">➕ Nowy Quiz</button>
        <button class="neu-btn btn-delay-2">📚 Biblioteka</button>
      </div>

    </div>

    <!-- DOLNY RZĄD: OSTATNIE LEKCJE ROZBITO NA 2 MIEJSCE KARTY -->
    <div class="grid-2">
      <div class="neu-card row-2-left">
        <div class="card-title">📐 Matematyka - Klasa 8B</div>
        <p style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;">Ostatnio używane: Twierdzenie Pitagorasa</p>
        <button class="neu-btn">Wznów Lekcję</button>
      </div>

      <div class="neu-card row-2-right">
        <div class="card-title">🧪 Chemia - Klasa 7A</div>
        <p style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;">Ostatnio używane: Układ Okresowy</p>
        <button class="neu-btn">Wznów Lekcję</button>
      </div>
    </div>

  </div>

  <script>
    // Fala liter dla nazwy w menu
    function animateText(elementId, baseDelay) {
      const el = document.getElementById(elementId);
      const text = el.innerText;
      el.innerHTML = '';
      
      [...text].forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.innerHTML = char === ' ' ? '&nbsp;' : char;
        span.style.animationDelay = `${baseDelay + (index * 0.035)}s`;
        el.appendChild(span);
      });
    }

    animateText('logoText', 0.15);

    // Rozwijanie menu górnego
    const profileBtn = document.getElementById('profileBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
    });
  </script>

</body>
</html>
