<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Nauczyciela - Classroom Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Nawigacja Górna */
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-name {
      color: #cbd5e1;
      font-weight: 600;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Główny układ */
    main {
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 32px;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Karty UI */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #f1f5f9;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    /* Formularze */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #38bdf8;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Przyciski */
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0369a1;
    }

    .btn-success {
      background: #16a34a;
    }

    .btn-success:hover {
      background: #15803d;
    }

    /* Lista zestawów */
    .set-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .set-item:hover, .set-item.active {
      border-color: #38bdf8;
    }

    .set-item h3 {
      font-size: 1rem;
      color: #f8fafc;
    }

    .set-item p {
      font-size: 0.8rem;
      color: #64748b;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Classroom Quiz — Panel Nauczyciela</h1>
    <div class="user-info">
      <span class="user-name" id="teacher-display">Ładowanie...</span>
      <button class="btn-logout" onclick="logoutTeacher()">Wyloguj</button>
    </div>
  </header>

  <main>
    <!-- Lewa Kolumna: Zestawy pytań -->
    <section>
      <div class="card">
        <h2>Stwórz Nowy Zestaw</h2>
        <form id="create-set-form">
          <div class="form-group">
            <label for="set-title">Nazwa zestawu</label>
            <input type="text" id="set-title" placeholder="np. Historia - Mieszko I" required>
          </div>
          <button type="submit" class="btn">Dodaj Zestaw</button>
        </form>
      </div>

      <div class="card">
        <h2>Moje Zestawy Pytań</h2>
        <div id="sets-list">
          <div class="empty-state">Pobieranie zestawów...</div>
        </div>
      </div>
    </section>

    <!-- Prawa Kolumna: Zarządzanie pytaniami & Uruchamianie Gry -->
    <section>
      <div class="card" id="session-card" style="display: none;">
        <h2>Uruchom Grę dla Uczniów</h2>
        <p style="color: #94a3b8; margin-bottom: 12px; font-size: 0.9rem;">
          Wybrany zestaw: <b id="selected-set-title" style="color: #38bdf8;">—</b>
        </p>
        <button class="btn btn-success" id="start-game-btn">Stwórz Pokój Gry (Wygeneruj Kod)</button>
      </div>

      <div class="card" id="question-card" style="display: none;">
        <h2>Dodaj Pytanie do Zestawu</h2>
        <form id="add-question-form">
          <div class="form-group">
            <label for="q-text">Treść pytania</label>
            <input type="text" id="q-text" placeholder="Treść pytania..." required>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="op-a">Opcja A</label>
              <input type="text" id="op-a" required>
            </div>
            <div class="form-group">
              <label for="op-b">Opcja B</label>
              <input type="text" id="op-b" required>
            </div>
            <div class="form-group">
              <label for="op-c">Opcja C</label>
              <input type="text" id="op-c" required>
            </div>
            <div class="form-group">
              <label for="op-d">Opcja D</label>
              <input type="text" id="op-d" required>
            </div>
          </div>

          <div class="form-group">
            <label for="correct-op">Poprawna Odpowiedź</label>
            <select id="correct-op" required>
              <option value="A">Opcja A</option>
              <option value="B">Opcja B</option>
              <option value="C">Opcja C</option>
              <option value="D">Opcja D</option>
            </select>
          </div>

          <button type="submit" class="btn">Zapisz Pytanie</button>
        </form>
      </div>

      <div class="card" id="questions-list-card" style="display: none;">
        <h2>Lista Pytań w Zestawie</h2>
        <div id="questions-list"></div>
      </div>
    </section>
  </main>

  <script src="supabase.js"></script>
  <script>
    let currentTeacher = null;
    let selectedSetId = null;

    // Asekuracja i inicjalizacja danych po załadowaniu
    window.addEventListener('DOMContentLoaded', async () => {
      // Weryfikacja zalogowania przez funkcję z supabase.js
      currentTeacher = requireTeacherAuth();
      if (currentTeacher) {
        document.getElementById('teacher-display').textContent = currentTeacher.imie_nazwisko;
        await loadTeacherSets();
      }
    });

    // Pobieranie zestawów z bazy
    async function loadTeacherSets() {
      const container = document.getElementById('sets-list');
      const { data, error } = await getTeacherSets(currentTeacher.id);

      if (error) {
        container.innerHTML = `<div class="empty-state">Błąd pobierania danych</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Brak zestawów. Stwórz pierwszy!</div>`;
        return;
      }

      container.innerHTML = '';
      data.forEach(set => {
        const item = document.createElement('div');
        item.className = `set-item ${selectedSetId === set.id ? 'active' : ''}`;
        item.innerHTML = `
          <div>
            <h3>${set.nazwa_zestawu}</h3>
            <p>ID: ${set.id}</p>
          </div>
        `;
        item.onclick = () => selectSet(set.id, set.nazwa_zestawu);
        container.appendChild(item);
      });
    }

    // Dodawanie nowego zestawu
    document.getElementById('create-set-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const titleInput = document.getElementById('set-title');
      const title = titleInput.value.trim();

      if (!title) return;

      const { data, error } = await createQuestionSet(currentTeacher.id, title);
      if (error) {
        alert('Błąd dodawania zestawu: ' + error);
      } else {
        titleInput.value = '';
        await loadTeacherSets();
        selectSet(data.id, data.nazwa_zestawu);
      }
    });

    // Wybór zestawu z listy
    async function selectSet(setId, setNazwa) {
      selectedSetId = setId;
      document.getElementById('selected-set-title').textContent = setNazwa;

      document.getElementById('session-card').style.display = 'block';
      document.getElementById('question-card').style.display = 'block';
      document.getElementById('questions-list-card').style.display = 'block';

      await loadTeacherSets(); // Odświeża aktywny stan na liście
      await loadQuestions(setId);
    }

    // Pobieranie pytań z wybranego zestawu
    async function loadQuestions(setId) {
      const container = document.getElementById('questions-list');
      const { data, error } = await getQuestionsFromSet(setId);

      if (error || !data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Brak pytań w tym zestawie. Dodaj pierwsze!</div>`;
        return;
      }

      container.innerHTML = data.map((q, idx) => `
        <div style="background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 8px;">
          <b style="color: #38bdf8;">${idx + 1}. ${q.pytanie}</b>
          <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">
            A: ${q.opcja_a} | B: ${q.opcja_b} | C: ${q.opcja_c} | D: ${q.opcja_d}
            <span style="color: #4ade80;"> (Poprawna: ${q.poprawna_opcja})</span>
          </div>
        </div>
      `).join('');
    }

    // Dodawanie nowego pytania
    document.getElementById('add-question-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedSetId) return;

      const questionData = {
        pytanie: document.getElementById('q-text').value.trim(),
        opcja_a: document.getElementById('op-a').value.trim(),
        opcja_b: document.getElementById('op-b').value.trim(),
        opcja_c: document.getElementById('op-c').value.trim(),
        opcja_d: document.getElementById('op-d').value.trim(),
        poprawna_opcja: document.getElementById('correct-op').value
      };

      const { error } = await addQuestion(selectedSetId, questionData);
      if (error) {
        alert('Błąd zapisywania pytania: ' + error);
      } else {
        document.getElementById('add-question-form').reset();
        await loadQuestions(selectedSetId);
      }
    });

    // Tworzenie nowej sesji gry (Generowanie Kodu)
    document.getElementById('start-game-btn').addEventListener('click', async () => {
      if (!selectedSetId) return;

      // Generowanie losowego 6-cyfrowego kodu
      const gameCode = Math.floor(100000 + Math.random() * 900000).toString();

      const { data, error } = await createGameSession(selectedSetId, gameCode);
      if (error) {
        alert('Błąd tworzenia sesji gry: ' + error);
      } else {
        // Przechodzimy do widoku lobby dla nauczyciela z kodem pokoju w URL
        window.location.href = `lobby_nauczyciel.html?kod=${gameCode}&session_id=${data.id}`;
      }
    });
  </script>
</body>
</html>
